{
  "id": "zx80-zx81",
  "title": "ZX80 and ZX81 DEBUG File",
  "subtitle": "Structure, CPU-generated video, and simulated peripherals",
  "output": "docs/ZX81Data/ZX80_ZX81_DEBUG_File_Format.docx",
  "models": "ZX80 and the PAL/NTSC ZX81 variants supported by the ZX81 executable.",
  "cpu": "Zilog Z80.",
  "components": [
    [
      "210",
      "ULA",
      "Raster, sync, line counter, video shift register, and port read results"
    ],
    [
      "100/101",
      "Datasette",
      "Tape port and load simulation"
    ],
    [
      "102",
