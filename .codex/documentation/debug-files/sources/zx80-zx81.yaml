    "+",
    "ULA     12207       Line Advance",
    "                    Raster position     :HBefore=413,VBefore=100,HAfter=0,VAfter=101",
    "                    Cause               :ExternalSync=0,RasterEnd=1,INTackClock=NA",
    "                    Internal status     :Model=0,LNBefore=3,LNAfter=4,LNBlocked=0,VSYNC=0,NMIGenerator=0",
    "                    CPU context         :PC=49152,I=14,R=127,HALT=1,IFF1=1",
    "                    Timing              :PixelPhase=1,CPUClock=12208,State=AfterLineAdvance,CPUState=SimulationContext",
    "+"
  ],
  "example_note": "Schematic independent examples based on current producers; values are illustrative, not a captured execution trace.",
  "limitations": [
    "ZX80 and ZX81 share one document because the executable and ULA class parameterise the type.",
    "The ULA derives its cycle from _lastCPUCycles and i>>1; it must not be replaced with cpu.clockCycles()-i.",
    "A tape or printer trap describes firmware simulation, not an electrical signal.",
    "Port Read timestamps cannot measure exact I/O or VSYNC pulse widths. The record shows post-read state and cannot reconstruct the raster before an IN reset.",
    "A zero Current shift byte does not prove that all eight pixels have shifted out. These fields do not identify rejected character loads or actual INT acknowledgement.",
    "PEEK currently still has side effects in PortManager, including MIC updates. Logging reports existing behavior without changing it. Debug methods use non-consuming state getters.",
    "Line Advance establishes modeled causes and actual counter changes, but does not by itself prove a visual defect or the electrical timing of HSYNC. Correlate events with the image and distinguish CPU execution context from the ULA pixel timestamp."
  ],
