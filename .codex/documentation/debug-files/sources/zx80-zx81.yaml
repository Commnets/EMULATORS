    [
      "Memory",
      "ZX80/ZX81 map",
      "Applied Set for selected subsets"
    ]
  ],
  "records": [
    {
      "name": "ULA — Info Cycle",
      "producer": "src/ZX81/ULA.cpp :: debugULACycle",
      "fields": "Raster position: zero-based column and line. Internal status: NMI=NMI_ON|NMI_OFF, ZONE=WHITE|BLACK, LNCTRL (0-7), LineSyncActive (0/1). Shift register: Data (decimal byte), PendingBits (0-8), Inverse (0/1). Timing: PixelPhase (0/1), State=BeforeShift.",
      "timing": "Header clock is _lastCPUCycles + (i >> 1), in CPU T-states. PixelPhase distinguishes the two pixels per T-state. The snapshot follows due horizontal-generator events and pattern loads, before pixel shifting and presentation advance. It contains no per-pixel CPU snapshot or CPUClock field.",
      "events": "ZONE names the syncOutputWhite presentation gate, not a physical sync voltage or noise source. LineSyncActive describes the ZX80 coarse line model; ZX81 hardware timing uses separate generator records."
    },
    {
      "name": "ULA — Port Read",
      "producer": "src/ZX81/ULA.cpp :: debugPortRead, called by src/ZX81/PortManager.cpp :: getValue",
      "fields": "Raster position: Column and Row (zero-based). Port: Access=READ|PEEK, Address (full 16-bit address), ID (port selector), Data (returned byte), D6 and D7. Internal status: NTSC, EAR, MIC, VSYNC, LNCTRL and LNBlocked. Timing: Reference=LastULASimulatedCPUClock, State=AfterRead. All numbers are decimal; flags are 0/1.",
      "timing": "Emitted at the end of every getValue call, including odd ports and PEEK, only when ULA deep debug is active. Header time is _lastCPUCycles: the last CPU cycle processed by the ULA, not the exact I/O sample time. State is observed after the read side effects.",
      "events": "For even ports D6 preserves the regional selection and D7 carries EAR. With no keys pressed, PAL returns 127 or 255 for EAR=0 or 1; NTSC returns 63 or 191. Odd-port data comes from lastVRAMByteRead and has no such bit interpretation. PEEK identifies monitor inspection and must not be counted as an executed IN instruction."
    },
    {
      "name": "ULA — Character Capture",
      "producer": "src/ZX81/ULA.cpp :: debugCharCapture",
      "fields": "Character: Code, I. Refresh: R and Address (full 16-bit I:R). Timing: CaptureClock, LoadClock, LoadPhase, DelayPixels, Reference=InitialOpcodeFetch. Numbers are decimal.",
      "timing": "CaptureClock identifies capture. Refresh.Address preserves I:R before this M1 increments R, including I0 and R7. No increment is anticipated and CPU state is not modified. Earlier prefix increments are already present; prefix timestamps retain the existing approximation.",
      "events": "Each queued capture retains its own refresh address despite subsequent CPU changes. Capture is independent of RAM configuration; the load later consults the active expansion capability."
    },
    {
      "name": "ULA — Character Load",
      "producer": "src/ZX81/ULA.cpp :: debugCharLoad",
      "fields": "Raster position: Column, Row. Character: Code, I, LNCTRL. Refresh: R, Address. Pattern: Source=RAMRefresh|CharacterPath, Address, Data, Accepted (NA before load, 0/1 afterwards). Shift register: Data, PendingBits, Inverse. Timing: CaptureClock, ScheduledClock, ScheduledPhase, ActualClock, ActualPhase, Late, Stage=BeforeLoad|AfterLoad. Numbers are decimal.",
      "timing": "Header is the actual load clock. Refresh.R is the pre-increment value retained from the captured M1, not the live CPU register at load time. ScheduledPhase and ActualPhase distinguish the two pixels per T-state.",
      "events": "Refresh.Address retains I:R including I0. Source=RAMRefresh selects this address when the active 16K expansion supports refresh reads, including its ULA-view mirror. Source=CharacterPath retains the previous character-formula address otherwise; it does not necessarily mean ROM. Pattern.Address is the effective address read. This fallback preserves compatibility and does not model an undriven refresh bus. Rejected loads are consumed, not rescheduled."
    },
    {
      "name": "ULA — Line Advance",
      "producer": "src/ZX81/ULA.cpp :: debugLineAdvance, called by ULA::simulate",
      "fields": "Raster position: HBefore,HAfter,VBefore,VAfter. Internal status: LNCTRL,PendingBits. Timing: PixelPhase,State=AfterHorizontalWrap.",
      "timing": "Emitted after a presentation horizontal wrap and vertical advance. Does not increment LINECTRL or request NMI on ZX81.",
      "events": "Presentation only. INT response alignment can suppress a coincident wrap. Compare separate hardware generator records."
    },
    {
      "name": "ZX81DN — Datasette trap executed",
      "producer": "src/ZX81/Datasette.cpp :: debugSimulation",
      "fields": "ZX81DN header, CPU cycle, and the literal Datasette trap executed.",
      "timing": "Emitted when tape-routine simulation is applied.",
      "events": "Contains no additional attributes."
    },
    {
      "name": "ZX81PRT — Printer trap executed",
      "producer": "src/ZX81/StdPrinter.cpp :: debugSimulation",
      "fields": "ZX81PRT header, CPU cycle, and the literal Printer trap executed.",
      "timing": "Emitted when the printer routine is intercepted.",
      "events": "The device manages printed content; this header confirms the trap."
    },
    {
      "name": "ULA — Line Sync",
      "producer": "src/ZX81/ULA.cpp :: debugLineSync",
      "fields": "Raster position: HBefore,HAfter,Row. Cause: ExternalSync,InternalSync,AlreadyActive,Applied,INTackClock. Internal status: LNBefore,LNAfter,LNBlocked,NMIGenerator,PendingBits. Timing: PixelPhase,TailPixels,State=AfterLineSync.",
      "timing": "ZX80 only; retains the existing coarse line model.",
      "events": "Not a ZX81 hardware sync record."
    },
    {
      "name": "ULA — INT Response / Horizontal Reset / HSync Start / HSync End",
      "producer": "src/ZX81/ULA.cpp :: debugHorizontalTiming",
      "fields": "Generator: Before,After (ULA clocks),HSync,ResetPending. Raster position: Column,Row. Internal status: LNBefore,LNAfter,LNBlocked,NMIGenerator,NMIRequested. Timing: PixelPhase,Cause,ResponseClock,ResetClock,State=AfterEvent. Flags 0/1; numeric fields decimal.",
      "timing": "ZX81 only. Baseline period 414 ULA clocks; start at 32, end at 64. INT Response schedules reset two CPU T-states later at phase 0. Reset wins over a simultaneous sync edge. HSync Start updates LINECTRL before character load and may request NMI. HSync End may also be caused by INT acknowledgement. InitializationOrVSync has only the last simulated ULA clock reference, not an exact bus time; ResponseClock/ResetClock are not applicable to that cause.",
      "events": "Causes: CPUResponse,INTAcknowledge,Counter,InitializationOrVSync. ResponseClock is the CPU response-start timestamp, not /IORQ. Generator wraps independently of raster; terminal wrap creates no sync edge. HALT/NMI response compensation is reported separately by CPU NMI Synchronization; ordinary-instruction WAIT remains unmodeled. Initial counter 4 corresponds to presentation H=0; this preserves the existing coarse VSYNC restart and text-coordinate mapping. 207 T is the compatibility baseline, not a resolution of the 207/208 T hardware question."
    },
    {
      "name": "CPU — NMI Synchronization",
      "producer": "src/ZX81/CZ80.cpp :: debugNMISynchronization",
      "fields": "Request: RequestClock,AcceptanceClock. Synchronization: HALTBefore,Latency,AdditionalCycles. Model: Reference=HALT4T,Applied,Reason. Timing: NominalCycles,TotalCycles,State=BeforeResponseExecution. All clocks/durations are CPU T-states; flags are 0/1.",
      "timing": "Emitted by CPU deep debug at acceptance of NMI from the linked ULA with reason 1, before generic interrupt execution changes HALT or PC. The generic transaction record still reports the nominal 11 T. Full mode extends the elapsed response duration; PerCycle mode extends remaining response cycles once.",
      "events": "HALTed ZX81 with latency 0..4 receives 17-Latency additional cycles, the coarse four-T phase compensation compared with picozx81. NotHalted,LatencyOutsideModel,ModelNotSupported record exclusions, not proof of zero physical WAIT. PhaseCompensation identifies application. No ordinary-instruction WAIT, exact pin-level WAIT, or CPU/chip batch interleaving is implemented. ZX80 receives no additional cycles."
    }
  ],
