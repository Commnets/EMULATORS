    "+"
  ],
  "example_note": "Schematic independent examples based on current producers; values are illustrative, not a captured execution trace.",
  "limitations": [
    "ZX80 and ZX81 share one document because the executable and ULA class parameterise the type.",
    "The ULA derives its cycle from _lastCPUCycles and i>>1; it must not be replaced with cpu.clockCycles()-i.",
    "A tape or printer trap describes firmware simulation, not an electrical signal.",
    "Port effects remain immediate. Port Read timestamps cannot measure exact I/O or VSYNC pulse widths: they use the last simulated ULA clock. The record shows post-read state and cannot reconstruct the raster before an IN reset.",
    "A zero Shift register Data byte does not prove that all pixels have shifted out; consult PendingBits. Character Load reports rejected loads; INT Response and Horizontal Reset identify distinct timing stages.",
    "PEEK preserves hardware state, MIC change notifications and screen event markers. It can emit a Port Read debug record, which is not an executed IN. Debug methods use non-consuming state getters.",
    "Line Advance reports presentation only. Use HSync Start and Horizontal Reset for ZX81 hardware-model timing; Line Sync is ZX80 only.",
    "PerCycle execution can batch several CPU boundaries before chips run. INT sampling/acceptance and the single acknowledgement latch therefore retain the documented coarse-scheduling limits.",
    "HALT/NMI compensation is a response-duration approximation; ordinary-instruction WAIT and exact pin-level WAIT remain unmodeled. Prefix character-capture timestamps retain the initial-fetch approximation."
  ],
