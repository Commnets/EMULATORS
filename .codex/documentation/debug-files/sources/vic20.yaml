  "example_note": "Schematic excerpt built from the current literals and fields; values are illustrative. It shows the first of the two advanced cycles, not a complete instruction trace. The second cycle snapshot and its later completion are omitted.",
  "limitations": [
    "VIC-I CPU-timed reads use one predicted read point per complete instruction. Multiple I/O reads at distinct bus cycles, missing dummy reads, instruction fetches from I/O, un-timestamped external inputs, global cross-chip phase interleaving and physical half-cycle priority are not resolved. Raster reads use the current Raster model, including its existing NTSC line numbering and interlace limitations.",
    "CPU-timed writes replay distinct RMW writes from buffered bus metadata; read advancement stops before the first write. The experimental schedule starts counter increments at N+3 after a horizontal comparison at N, matrix/color reads at N+5, and glyph/high output at N+6; low output follows one cycle later. Counter activation captures the pending columns once and counts twice that width; acquisitions use the same width and can drain after counting stops. Columns are sampled at horizontal cycle 1; rows at line 0, cycle 2, after origin comparisons. Frame reset preserves samples. Glyph height is live with a masked row address. X bounds are recorded at the first emitted group; bounds without output do not establish displayed geometry. Matrix offsets ((counter+1)&$fff)>>1 are retained two cycles before use. Character-row completion saves the counter endpoint before reload. Final-cycle increments can retain carries into bits 4 and 8. Physical line reset discards delayed work. The PAL origin-36, width-22 schedule now permits 32 increments, but this arithmetic result is not hardware validation. Fetch/output phase alignment, unusual geometries, the rounded $fff address, simultaneous boundary operations and subcycle behavior remain unvalidated. The fixed $1c00 inactive read has been removed; electrical open-bus behavior and undriven color bits remain unimplemented.",
    "VIA read-point advancement requires complete-instruction CPU execution. Multiple VIA reads at distinct bus cycles in one instruction, missing dummy reads, instruction fetches from I/O, un-timestamped external inputs, cross-chip phase interleaving and physical half-cycle priority are not resolved by that model.",
    "VIA PortA/PortB contain OR,IR,DDR, not pin levels or timer/interrupt state. Correlate accesses with CPU context and source code; record order across chips is not a globally chronological bus trace.",
    "ALLIO may include records from dynamically connected peripherals."
  ],
