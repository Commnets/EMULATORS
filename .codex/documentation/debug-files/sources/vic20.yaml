  "records": [
    {
      "name": "VICI — Info Cycle",
      "producer": "src/COMMODORE/VICI/VICI.cpp :: debugVICICycle",
      "fields": "Raster: zero-based column, zero-based line, and raster cycle; CPU timing: CyclesAdvanced counts cycles already started by pre-instruction advancement when the snapshot is emitted; Fetch: decimal MatrixBaseHalf and MatrixHalf in half-character acquisition units, decimal Column and Columns in character units, Phase (Start/Matrix/Glyph), decimal StartupLeft and CounterStartupLeft in CPU cycles, decimal CounterHalvesLeft in half-cell units, decimal MatrixOffset in character-address units, hexadecimal PendingCode, PendingColor, OutputByte, OutputColor, and decimal HalvesLeft; Memory: hexadecimal Screen, Characters, and Color.",
      "timing": "The header receives the explicit absolute cycle passed to debugVICICycle(cycle), after evaluating live origin comparisons and before that cycle's video fetch/output. In complete-instruction CPU-timed mode, records can be emitted during CPUAboutToExecute while advancing to the read point and later during simulate() for the remaining cycles. The final advanced cycle keeps its raster position during the CPU read; simulate() closes it without repeating its fetch/output or snapshot. CPU writes precede counter updates. The clock origin is aligned during initialization, including when it is zero.",
      "events": "The snapshot precedes video activity. Phase identifies the next acquisition; Start delays acquisition independently of the counter. MatrixBaseHalf and MatrixHalf are retained and working positions in the experimental 12-bit model. Physical horizontal cycle zero reloads the base and consumes boundary carries. CounterStartupLeft is decremented during video activity; its final step captures Columns and enables the first increment. CounterHalvesLeft counts remaining increments, independently of completed reads. Every two counter cycles prepare MatrixOffset for acquisition two cycles later; the current read consumes the old offset before replacement. Column advances only on a complete glyph read. PendingCode/PendingColor belong to acquisition; OutputByte/OutputColor belong to retained output. HalvesLeft is the remaining output count before activity; retained bytes alone do not imply valid output. Startup and inactive cycles perform no character acquisition: PendingCode/PendingColor retain their last acquired values. This does not specify physical bus levels. Neither Phase nor Column alone establishes counter activity. An advanced CPU-read cycle is completed later without repeating video activity. Line reset cancels both startups, pending address and output. Line end captures the endpoint before reset."
    },
    {
      "name": "VICI — Line end",
      "producer": "src/COMMODORE/VICI/VICI.cpp :: debugVICILineEnd",
      "fields": "Raster: decimal Line (physical raster position) and Cycle (one-based raster cycle); Matrix: decimal BaseHalf and EndHalf in half-character acquisition units; Acquisition: Opened (0/1), decimal Column and Columns in character units, and StartupLeft in CPU cycles; Vertical: decimal Row (character row) and GlyphLine (row within the glyph).",
      "timing": "Emitted only when finishing the final physical cycle of each raster line, after its video fetch/output and any CPU write, but before treatRasterCycle() updates vertical state and resets horizontal state. The header uses the same explicit absolute cycle as the final Info Cycle. A pre-advanced CPU read cycle emits this event only when later completed, without repeating its video activity.",
      "events": "Correlate with the final Info Cycle. BaseHalf precedes the end-of-row commit; EndHalf is the working endpoint after the final counter step, whether or not a memory acquisition occurred. Column counts completed glyph reads and can lag counter progress. Opened=0 means no window opening; EndHalf reflects the physical-line reload, possibly modified by retained carries. After this event, nextVertical() derives carries only from a final-cycle increment and saves the endpoint if an opened line completes a character row. Carries affect their own four-bit groups on the next reload. Row and GlyphLine precede the vertical increment. This event does not emit carry state or pending address validity. The boundary ordering remains experimental."
    },
    {
      "name": "VICI — CPU transaction timing",
      "producer": "src/COMMODORE/VICI/VICI.cpp :: debugCPUAboutToExecute",
      "fields": "Transaction(Type, Address, Code, Cycles); Raster origin(Row, Cycle); CPU read point(AdvanceCycles). Cycles is the complete predicted instruction duration. AdvanceCycles includes the video phase of the selected read cycle and is capped before the first write cycle.",
      "timing": "Emitted after preparing the instruction bus context and before advancing VIC-I. Raster origin is the position at the instruction boundary, before any advance.",
      "events": "Following Info Cycle records show the pre-instruction advance. The final cycle remains pending until the ordinary CPU read has occurred. There is no dedicated CPU read event in this producer."
    },
    {
      "name": "VICI Sound — Info Cycle",
      "producer": "src/COMMODORE/VICI/VICI.cpp :: SoundFunction::debugVICISoundCycle",
      "fields": "Voice state produced by the wrapper: activity, volume/frequency, and waveform according to the current sound structure.",
      "timing": "cpu.clockCycles()-i for each sound cycle actually generated. Before a CPU write to $900a-$900e, sound finishes the old interval through the end of that bus cycle. Remaining sound cycles run afterwards without replay; sound records can therefore interleave with VIC-I cycle records.",
      "events": "Adds no subordinate events."
    },
    {
      "name": "VIA1/VIA2 — Info Cycle",
      "producer": "src/COMMODORE/VIA/VIA.cpp :: debugVIACycle",
      "fields": "PortA and PortB each contain OR,IR,DDR: three comma-separated hexadecimal bytes from VIAPort::asString(). OR is the output latch, IR the cached port-read value, and DDR the stored direction register; these tuples are not live pin values.",
      "timing": "The header receives the explicit absolute cycle passed to debugVIACycle(cycle), before that cycle's internal VIA activity. In CPU-timed complete-instruction mode, ordinary cycle records can be emitted during CPUAboutToExecute while advancing to the predicted read point, and later during simulate() for the remaining cycles. The pending final advanced cycle is completed after the CPU access without a second snapshot.",
      "events": "No dedicated timer, IFR/IER or CA1/CA2/CB1/CB2 state/event lines are emitted by this method. A port tuple alone cannot reconstruct control-line transitions or the enabled interrupt source."
    },
    {
      "name": "Datasette/SerialIO",
      "producer": "src/COMMODORE/1530Datasette.cpp and src/COMMODORE/SerialIOPeripherals.cpp",
      "fields": "C2N1530DN and SerialIO trap states, block/header found, errors or missing data, and serial-protocol states.",
      "timing": "Uses the CPU cycle of the observed trap or transition.",
      "events": "Some information is written as simple text before a complete header."
    }
  ],
