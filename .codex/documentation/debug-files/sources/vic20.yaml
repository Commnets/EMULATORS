{
  "id": "vic20",
  "title": "VIC-20 DEBUG File",
  "subtitle": "Structure, fields, and interpretation criteria",
  "output": "docs/VIC20Data/VIC20_DEBUG_File_Format.docx",
  "models": "VIC-20 PAL and NTSC; memory configurations and console or console-free executables.",
  "cpu": "MOS 6502.",
  "components": [
    [
      "106",
      "VIC-I",
      "Raster, instruction projection, screen/character/colour memory, and sound"
    ],
    [
      "210",
      "VIA1",
      "PortA and PortB; signals connected according to the model"
    ],
    [
      "211",
      "VIA2",
      "PortA and PortB; keyboard, joystick, and peripherals"
    ],
    [
      "I/O",
      "Datasette 1530/IEC/printer",
      "Tape traps and serial state when selected"
    ],
    [
      "Memory",
      "VIC-20 map",
      "Applied Set for selected subsets"
    ]
  ],
  "records": [
    {
      "name": "VICI — Info Cycle",
      "producer": "src/COMMODORE/VICI/VICI.cpp :: debugVICICycle",
      "fields": "Raster: zero-based column, zero-based line, and raster cycle; Instruction projection: PositionsToEffect; Memory: hexadecimal Screen, Characters, and Color.",
      "timing": "cpu.clockCycles()-i for each recovered position.",
      "events": "This method adds no subordinate events."
    },
    {
      "name": "VICI — CPU transaction projection",
      "producer": "src/COMMODORE/VICI/VICI.cpp :: debugCPUAboutToExecute",
      "fields": "Transaction(Type, Address, Code, Cycles); Raster origin(Row, Cycle); Raster projection(PositionsToEffect).",
      "timing": "Emitted when VIC-I receives the context of the next instruction.",
      "events": "Allows the projection to be compared with PositionsToEffect in following cycles."
    },
    {
      "name": "VICI Sound — Info Cycle",
      "producer": "src/COMMODORE/VICI/VICI.cpp :: SoundFunction::debugVICISoundCycle",
      "fields": "Voice state produced by the wrapper: activity, volume/frequency, and waveform according to the current sound structure.",
      "timing": "cpu.clockCycles()-i.",
      "events": "Adds no subordinate events."
    },
    {
      "name": "VIA1/VIA2 — Info Cycle",
      "producer": "src/COMMODORE/VIA/VIA.cpp :: debugVIACycle",
      "fields": "PortA and PortB each contain OR,IR,DDR: three comma-separated hexadecimal bytes from VIAPort::asString(). OR is the output latch, IR the cached port-read value, and DDR the stored direction register; these tuples are not live pin values.",
      "timing": "The header receives the explicit absolute cycle passed to debugVIACycle(cycle), before that cycle's internal VIA activity. In CPU-timed complete-instruction mode, ordinary cycle records can be emitted during CPUAboutToExecute while advancing to the predicted read point, and later during simulate() for the remaining cycles. The pending final advanced cycle is completed after the CPU access without a second snapshot.",
      "events": "No dedicated timer, IFR/IER or CA1/CA2/CB1/CB2 state/event lines are emitted by this method. A port tuple alone cannot reconstruct control-line transitions or the enabled interrupt source."
    },
    {
      "name": "Datasette/SerialIO",
      "producer": "src/COMMODORE/1530Datasette.cpp and src/COMMODORE/SerialIOPeripherals.cpp",
      "fields": "C2N1530DN and SerialIO trap states, block/header found, errors or missing data, and serial-protocol states.",
      "timing": "Uses the CPU cycle of the observed trap or transition.",
      "events": "Some information is written as simple text before a complete header."
    }
  ],
  "example": [
    "CPU     24500       Info Cycle",
    "                    Last 2 cycles",
    "                    PC:$e000(Stack 255) SEI",
    "VICI    24500       CPU transaction projection",
    "                    Raster origin       :Row=12,Cycle=33",
    "VICI    24500       Info Cycle",
    "                    Raster              :120,11,33",
    "                    Memory              :Screen=$1e00,Characters=$8000,Color=$9400",
    "+"
  ],
  "example_note": "Schematic example built from the code's current literals and fields; values are illustrative.",
  "limitations": [
    "The VIC-I projection expresses internal positions, not necessarily physical CPU-bus cycles.",
    "VIA read-point advancement requires complete-instruction CPU execution. Multiple VIA reads at distinct bus cycles in one instruction, missing dummy reads, instruction fetches from I/O, un-timestamped external inputs, cross-chip phase interleaving and physical half-cycle priority are not resolved by that model.",
    "VIA PortA/PortB contain OR,IR,DDR, not pin levels or timer/interrupt state. Correlate accesses with CPU context and source code; record order across chips is not a globally chronological bus trace.",
    "ALLIO may include records from dynamically connected peripherals."
  ],
  "watched_sources": [
    "src/VIC20/VIC20.cpp",
    "src/COMMODORE/VICI/VICI.cpp",
    "src/COMMODORE/VIA/VIA.cpp",
    "src/COMMODORE/1530Datasette.cpp",
    "src/COMMODORE/SerialIOPeripherals.cpp"
  ]
}
