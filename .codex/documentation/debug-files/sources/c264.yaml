  "example_note": "Schematic excerpts with intervening cycle/fetch records omitted. The first four-cycle read instruction runs in forced slow mode: three CPU cycles complete before execution and cycle 50003 remains suspended; the read is captured before edge 23 and its TED pulse completes at 50004 after access. The second four-cycle store prepares three CPU cycles, leaving cycle 50006 suspended; its sole write at bus index 3 executes at 50007 while the observed CPU clock is 50008. Data and addresses are illustrative. Some Timing fields are omitted in the example for readability; the field inventory above describes the complete record.",
  "limitations": [
    "Connected mode recovers the readable prefix before instruction semantics. Logical bus progress excludes DMA waits. simulate validates nominal duration and extracts buffered writes once, retains the transaction through CPU stop ticks, and requests only remaining wait compensation through setStop. Prefix recovery can run ahead of the observed CPU clock; those periods are not repeated. This reuses instruction-granular CPU execution and does not provide semantic microcycle suspension or synchronized reads after writes.",
    "Register records retain observed CPU time and Origin=Unknown. Reads now see the prepared TED state in connected mode, without an independent timestamp for each read; scheduled CPU write pairs provide recovered write coordinates. Initialization is suppressed; enable TED 101 and memory 1010/ALLMEM for register records. Explicit peek inspection is silent; other readValue callers are not certified CPU accesses. No additional synchronization or absolute TED clock is introduced.",
    "Before-graphics and end records identify their actual phase events, not a shared future completion coordinate. Pair enabled slow-pulse records in traversal order. Raster events and fetch records are not additional elapsed CPU cycles.",
    "Fetch records report the addresses requested by TED. They do not identify the backing physical-storage offset after machine-specific RAM aliases or ROM mapping. Individual emitted pixels are not traced; Video output loaded reports the retained shift-register operands after load, before any coincident effective-control acceptance.",
    "The 6529B latches have no dedicated DEBUG producer.",
    "Legacy selector records remain available for setup/unscheduled changes; scheduled CPU writes apply board effects through the TED hook and consume the selector change flags. External selector changes are applied before machine hooks and again after hooks, before the next CPU fetch, without advancing emulated time.",
    "FREEZE preserves the relative phase and completed half-cycle remainder. Gating is retained at slow-pulse start; explicit programmed counter loads remain separate from automatic counter advancement. Sound still receives one pulse per slow boundary. This is the implemented transition policy, not a verified physical FREEZE or analog sound model.",
    "Timed-write mode requires complete CPU transactions and exact declared write counts. Writes are assigned their declared offsets plus preceding recovered wait cycles and are retained until applied. CPU wait compensation does not re-extract commands. Setup writes are flushed before activation; independent component mode remains available. Generic Applied Set records still lack a CPU timestamp; CPU write records provide the scheduled coordinate.",
    "Read advancement uses predicted cycle metadata before execution and validates actual duration afterwards. A failed CPU transaction is not rolled back. During preparation CPUBatchEnd is the planned boundary, not a clock already reached by the CPU.",
    "Programmable counters are independent of the framebuffer traversal. At H=360, V starts on the previous presentation line until its H=392 increment; later geometry movement never overwrites the counters. Register reads use live counters at the prepared access phase. Legacy GraphicalInfo raster fields are only a derived diagnostic image updated at completed CPU cycles.",
    "Host pacing uses the fixed board crystal and recovered crystal-clock durations. SPEED reports crystal clocks per second; its percentage compares against BaseHz. CLOCKFACTOR scales this pacing target, with factor 1 requesting normal speed. These values do not count raw executed CPU cycles per second.",
    "GRAPHICSREADY is emitted at the end of the completed TED pulse that enters the last VBlank zone, after the Info Cycle End record. It can occur during pre-execution read advancement; it is not deferred to the end of the CPU transaction. Frozen pulses do not generate raster transitions.",
    "FF07.6 selects divisor 20 or 16 independently of the fixed board crystal. The divisor is captured at CPU-cycle start, and changes apply to following CPU periods. Emulator initialization selects FF07=88 on PAL boards or C8 on NTSC boards; this is a deterministic startup configuration, not a measured power-on value. The selected profile supplies the divisor and end-of-screen decode immediately; the already captured CPU period keeps its divider. Presentation geometry switches separately at H=392 and the new vertical firstPosition, preserving hardware counters. CPU single/double speed changes do not reconfigure RasterData. The C264 screen follows the new nominal frame frequency derived from the fixed crystal and selected profile; its pending image is invalidated on selection and geometry application. Texture dimensions adapt on the next GRAPHICSREADY, retaining the last uploaded image meanwhile.",
    "Raster timing follows the selected FPGATED 1.9 implementation profile (ted.v SHA-256 d14f913821b71e3026c8b5deff851e78d4b1ed2dde6a0f6340521c4dbe539421), not a new measurement of every TED revision. The preliminary decode coordinates and plus4emu delayed-event model differ. Character-row reload timing, output sequencing, analog monitor acquisition, clock windows, divider-switch electrical transients and detailed bus arbitration retain their stated approximations. DMA now follows the selected implementation profile: request window after H=407 through the H=295 capture, three slow-clock lead intervals, then CPU-bus-phase ownership. State changes use real recovered phases rather than a second projected raster. This is an implementation reference, not independent silicon validation.",
    "Video output emits one pixel on quarter phases 3,7,11,15,19,23,27,31. Three fixed cell stages retain captures and feed a separate output cell whose graphics byte shifts. Waiting snapshots precede phase-31 metadata changes. Cursor inversion is applied on eligible standard-text loads. Effective mode and live FLASH/colors select each pixel from remaining bits. Multicolor pair phase toggles on every active non-load dot, including hires dots, and resets only on load or initialization. At H=440, preparation clears only next graphics and the three data bytes in current/waiting. Their cursor flags and software validity remain retained; retaining validity is an integration policy, not an additional hardware register. Output cell, diagnostic index, pair phase and border latches are unaffected. Transfer opening is qualified by retained display enable and closing remains after H=311 emission/load. Exact simultaneous load/preparation priorities under altered counter traversals still require runtime and hardware validation. Scroll selects loads after emission. RasterData retains presentation geometry; retained horizontal border state selects content output. Presentation-profile changes no longer clear pixel output state. FREEZE retains full-pulse graphics gating.",
    "Cursor matching is retained with the cell. At output load, standard character mode with FLASH bit 4 clear inverts the graphics byte; later mode changes do not reapply cursor inversion. Inverse and attribute FLASH are resolved from remaining bits at each pixel according to the selected profile; they are not universally applied to every text mode. FLASH remains a shared five-bit counter, and FF1F writes replace its low four bits and clear bit 4. This change follows the selected digital implementation profile, not new physical measurement.",
    "Memory reads use phase 15 for graphics capture/plane address preparation and phase 31 for plane capture/graphics address preparation, before next-line/scroll sampling and coincident scheduled CPU writes. H=432 opens preparation and reloads working positions; H=296 closes it while retaining the final graphics read. Normal first/last plane captures are H=439/295 and graphics captures H=443/299. Circular index and pending descriptors survive address reloads and frozen pulses as implemented. Output consumes retained cell operands and no longer uses live buffer indices. Row reloads and row-end work still use cycle 57; exact latch priorities, altered traversals, rare bus/idle corner cases, remaining border corner cases and exact output/control edge priorities remain limited. TEDEVENTS now shows actual matrix/attribute transfer pairs, completed accepted-raster rows with captured labels, and separate visible IRQ-request point markers. This consumption change completes the point-10 connection between captures and output; it does not claim complete silicon-level bus fidelity or the complete pixel/border sequencer.",
    "DMA state changes do not add TEDEVENTS overlay colors. Deep debug adds DMAWarning, DMABusGranted, DMABusReleased and the first CPU DMA stop record per transaction. State codes are 0 idle, 1/2/3 warning, 4 granted. FREEZE can retain an asserted request; prefix recovery yields to the stop scheduler. Interrupt vector reads and reads following writes retain the existing aggregate-CPU approximation. No hardware measurements, compilation or runtime validation accompany this change.",
    "Border latches follow the selected implementation profile rather than a new silicon measurement. Before each enabled dot emission, after scheduled CPU writes, clockBorders compares VideoLine against 4/204 for 25 rows or 8/200 for 24 rows. The vertical permission qualifies opening the horizontal latch at H=0 for 40 columns or H=8 for 38 columns, with retained display enable. Horizontal closing is H=320 or H=312 according to the current column control; missing a comparator preserves the previous latch state. Vertical closing does not directly overwrite an already open horizontal latch. Comparisons also run outside the visible crop. FREEZE retains both latches through the graphics gate. H=440 cell preparation and presentation-profile changes do not reset the border latches. TEDEVENTS reuses the existing five diagnostic palette entries; its overlay now distinguishes transfer groups, accepted raster rows, labels and IRQ-request points. The pixel shifter and slow-boundary mode controls are implemented separately; exact coincident-event priorities and hardware revision differences remain unvalidated. Compilation and runtime validation have not been performed.",
    "Effective output controls retain FF06 bits 6..5 and FF07 bits 7,4. Phase-31 address preparation, dot emission, shift/load and hardware-counter work use the preceding effective controls; acceptance then samples programmed controls before finishTEDCycle, including frozen pulses. A phase-15 mode write is deferred to that boundary. FF06/FF07 readback and register introspection still show programmed state. This is an explicit software acceptance policy based on FPGATED 1.9; conditional write/latch priority in the HDL, plus4emu renderer delays and silicon revision differences are not declared equivalent. No general delayed-event queue, absolute TED clock, analog color-write transient or CPU microcycle engine is introduced.",
    "CPU clock selection no longer uses legacy raster-cycle ranges or an independent VideoLine<=204 criterion. It uses retained external-fetch/refresher windows and retained display enable. In normal active-display traversal, refresh release at H=336 is accepted after H=343, allowing fast CPU periods from H=344; external-fetch opening at H=400 is accepted after H=407, requesting slow periods from H=408. Forced-slow and FREEZE retain their existing overrides. In disabled display, only refresh and the overrides request slow mode. The new flags survive presentation-profile changes and are advanced by enabled raster-control processing; skipped comparators do not reconstruct them from geometry. These coordinates describe the selected implementation profile and existing scheduler phase. The supplied C264.LOG predates this correction; its effect on the Moldi raster-bar instability still requires a new execution and trace. No compilation or emulator tests accompany this change.",
    "TEDEVENTS is diagnostic only. Each granted matrix-plane read with nonzero capture targets marks the current and preceding visible pixel after emission, clipped to one pixel at column zero. Attribute and character captures both qualify, and a shared capture produces one group. Badline detected still logs initial condition recognition and is no longer the source of a one-shot visual marker. RasterIRQ events retain the sampled hardware line and presentation row using vertical visibility even during horizontal blanking. After the row has rendered its last visible pixel, or for a late event in its trailing blank, a yellow full-width line is composed while preserving the single-row point mask. Labels use the captured number, not the later programmed comparator. Distinct-row IRQs within a frame remain visible; multiple events on the same pending row retain the latest number. Purple labels on orange occupy five already drawn rows above the line. For presentation rows 0..4, up to five numbers wait for completion of row 4 and are grouped in 24-pixel slots at the upper left. Closely spaced labels can overlap. IRQ requests are cyan points only on emitted visible pixels; frozen simulation does not draw a new point without emission. Geometry changes and toggles reset diagnostic state; FrameReady clears unfinished row/top-label metadata. A discontinuous traversal that abandons a pending row before visible completion discards its pending line on row change. TEDEVENTS takes priority over the independent GRIDON programmed-comparator overlay. No full-frame event table or alternate video buffer is added; live row marks use one byte per visible column. The supplied log does not validate this visual change, and no compilation or emulator tests accompany it."
