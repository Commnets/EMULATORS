  "records": [
    {
      "name": "TED - Info Cycle",
      "producer": "src/COMMODORE/TED/TED.cpp :: debugCycleContext / debugTEDCycle",
      "fields": "Timing(CPUHalf, CPUQuarter, CPUQuarterLength, ClockDivider, MasterCycles, Reference=TEDPhaseEvent, Snapshot=BeforeGraphics, CPUBatchStart, CPUBatchEnd, CPUBatchIndex, CPUBatchCycles, ConversionSingleClock, HalfCarryIn, HalfCarryOut); Raster position(Column, ColumnBase0, Row, RowBase0, Cycle, CounterColumn, CounterRow, VideoLine, CounterCycle); Internal(VCReload, VC, RC, VLMI, Idle); Display(DisplayEnabled, VideoActive, ScrollX, ScrollY, Rows25, Columns40); Badline(Latched, LastScrollY, WithinBadlineRange); Clock(SingleClock, ForcedSingleClock, Freeze, SelectedPAL, PresentationPAL, PresentationPending, SelectedDivider, GraphicsCycleActive); Graphics mode(Mode); Memory(Screen, Attributes, Characters, Bitmap, CPUROMActive, GraphicsROMSelected); Timers; Interrupt.",
      "timing": "Before the retained graphics work at the beginning of an enabled slow-clock pulse. Event coordinate = header + CPUQuarter/CPUQuarterLength. CPUQuarterLength is 16 for a fast CPU cycle or 32 for a slow one; one unit is a quarter dot. CPUHalf identifies the containing half and is not the exact fraction. CPUBatchIndex/CPUBatchCycles count CPU cycles. CPUBatchEnd may be predicted during read preparation. HalfCarryIn/Out describe the individual CPU cycle; no absolute TED clock is stored. ClockDivider is the divisor captured at CPU-cycle start (20 PAL or 16 NTSC); MasterCycles is the crystal-clock duration of that entire CPU cycle, not an event timestamp. A write within the cycle does not retroactively change these retained values. Graphics decoding follows the existing fetch work in beginTEDCycle and prepares one eight-dot result; it does not emit the complete block here.",
      "events": "Raster Row/Column and their Base0 variants describe presentation geometry. CounterRow/CounterColumn are the programmable hardware counters; VideoLine is their internal vertical capture. Cycle retains the existing graphics-cycle position at pulse start; CounterCycle is derived from live horizontal position and is zero outside 0..455. Timers and Interrupt retain their existing field encodings. Match Info Cycle to the next Info Cycle End in traversal order: their phase coordinates differ and may belong to different fast CPU cycles. SelectedDivider and SelectedPAL describe the current profile, whereas Timing.ClockDivider and ConversionSingleClock describe the retained CPU cycle. PresentationPAL describes the applied framebuffer geometry; PresentationPending means selected and applied profiles differ. GraphicsCycleActive is the retained slow-pulse gate, not a second FREEZE register."
    },
    {
      "name": "TED - Info Cycle End",
      "producer": "src/COMMODORE/TED/TED.cpp :: debugTEDCycleEnd",
      "fields": "Timing(CPUHalf, CPUQuarter, CPUQuarterLength, ClockDivider, MasterCycles, Reference=TEDPhaseEvent, Snapshot=AfterGraphics); Raster position; Internal; Clock(SingleClock, ForcedSingleClock, Freeze, SelectedPAL, PresentationPAL, PresentationPending, SelectedDivider, GraphicsCycleActive); Timers; Interrupt, including CPURequestClockArgument.",
      "timing": "After completing the slow pulse, including its eight individual dot emissions, counter work, timers and IRQ propagation. Header + CPUQuarter/CPUQuarterLength is this event coordinate. It differs from the beginning-of-graphics coordinate. Raster geometry shows the next presentation position.",
      "events": "CPURequestClockArgument is the integer CPU-cycle slot C passed to requestInterrupt, or a dash. The API has no quarter-dot argument; exact diagnostic phase coordinates do not imply finer CPU interrupt-entry support. A held request is not a new edge. FREEZE is the live register; graphics/timer gating is retained for the entire slow pulse."
    },
    {
      "name": "TED - Raster event",
      "producer": "src/COMMODORE/TED/TED.cpp :: finishTEDCycle / processCPUQuarter / processRasterControl / clockRasterDot / debugRasterEvent",
      "fields": "Timing(CPUHalf, CPUQuarter, CPUQuarterLength, ClockDivider, MasterCycles, Reference=TEDPhaseEvent); Event(Kind, SourceLine); Raster position(Column, ColumnBase0, Row, RowBase0, Cycle, CounterColumn, CounterRow, VideoLine, CounterCycle); Clock(SingleClock, ForcedSingleClock, Freeze, SelectedPAL, PresentationPAL, PresentationPending, SelectedDivider, GraphicsCycleActive); Pending(VerticalClock, FlashClock, HorizontalWrite); Interrupt.",
      "timing": "Header + CPUQuarter/CPUQuarterLength identifies the event edge. Kind is VideoLineLatch, VerticalClock, HorizontalLoad, FlashClock, RasterIRQ, RasterConfiguration or FrameReady. SourceLine is the previous capture, previous counter, current line or sampled IRQ operand as appropriate.",
      "events": "H=384 arms a vertical event consumed at the next slow boundary, with CPU load priority. H=392 captures VideoLine; the previous capture qualifies the end-of-screen character-reload reset. H=348 arms FLASH, clocked at the next slow boundary if VideoLine=205. Normal effective positions are V at 391->392 and FLASH at 351->352. Horizontal load occurs one dot after its write and preserves evolving low phase. Counter return uses EOS=311 PAL/261 NTSC; other values retain nine-bit overflow. RasterIRQ records a newly retained flag, including masked events. Pending fields are snapshots at the logging point, not a promise that later processing on the same edge has finished. RasterConfiguration is emitted after applying the selected presentation profile at H=392, when the newly captured VideoLine equals its vertical firstPosition (PAL 260, NTSC 235 by default). SourceLine is that captured line. It replaces and clears the framebuffer without resetting hardware counters or CPU-cycle phase; Raster Row/Column now use the applied geometry. Presentation advances one dot at each emission edge. On dot-clock edges, a scheduled CPU write executes before pixel emission and presentation advancement, then clockRasterDot advances the hardware counters. Consequently a RasterIRQ, VerticalClock, HorizontalLoad or FlashClock record after that edge shows the advanced presentation coordinate. Control-edge events retain their position before the next emission. This is the implemented ordering, not a measured video-output latency. FlashClock advances the shared five-bit FLASH counter; cursor visibility in standard text is derived from bit 4 being clear, while attribute blinking uses bit 4 being set. There is no separate screen-frequency cursor divider. FrameReady is logged after setting the last-VBlank entry latch and immediately before notifying GRAPHICSREADY. It records emulator image availability, not physical VSYNC or host presentation. SourceLine is the current VideoLine; Clock identifies selected and applied presentation profiles."
    },
    {
      "name": "TED - Badline detected",
      "producer": "src/COMMODORE/TED/TED.cpp :: debugBadLine",
      "fields": "Timing(CPUHalf, CPUQuarter, CPUQuarterLength, ClockDivider, MasterCycles, Reference=TEDPhaseEvent); Raster position; Internal; Badline(Latched, ScrollY, VideoActive, Cause=ScrollMatch).",
      "timing": "After latching the condition using VideoLine, clearing idle and resetting the retained character row. The diagnostic phase is the beginning-of-graphics event.",
      "events": "WithinBadlineRange uses the captured internal VideoLine. Presentation geometry is only a drawing coordinate. The existing combined-fetch approximation remains."
    },
    {
      "name": "TED - Video matrix read",
      "producer": "src/COMMODORE/TED/TED.cpp :: debugReadingVideoMatrix",
      "fields": "Timing(CPUHalf, CPUQuarter, CPUQuarterLength, ClockDivider, MasterCycles, Reference=TEDPhaseEvent); Raster position; Fetch(VCReload, VC, RC, VLMI, Idle); Matrix(Address, Value, Source=RAM); Attribute(Address, Value, Source=RAM).",
      "timing": "After both RAM reads and before VC increment. Logical addresses are reconstructed from unchanged registers/counters at this call site. Values are already-fetched bytes, not additional diagnostic reads.",
      "events": "VLMI is derived as graphics cycle minus 9 inside the retained cycles 9..48 window, so a repeated horizontal window stays within the 40-byte buffers. It is not an independently growing next-fetch index. Physical RAM alias resolution is not included."
    },
    {
      "name": "TED - Graphics read",
      "producer": "src/COMMODORE/TED/TED.cpp :: debugReadingGraphics",
      "fields": "Timing(CPUHalf, CPUQuarter, CPUQuarterLength, ClockDivider, MasterCycles, Reference=TEDPhaseEvent); Raster position; Fetch; Memory access(Kind, Source, Address, Value). Character fetches also report CharacterCode, CharacterMask and CharacterIndex in decimal.",
      "timing": "After the graphics read and before VC increment. Kind is Idle, Character or Bitmap. Source is TEDView for idle reads and the applied ROM/RAM selection for active reads. Address is logical and Value is already fetched.",
      "events": "Character addresses include masked code and RC; bitmap addresses include VC and RC. No extra memory access is performed."
    },
    {
      "name": "TED - Graphics prepared",
      "producer": "src/COMMODORE/TED/TED.cpp :: beginTEDCycle / debugPreparedGraphics",
      "fields": "Timing(CPUHalf, CPUQuarter, CPUQuarterLength, ClockDivider, MasterCycles, Reference=TEDPhaseEvent, Snapshot=AfterPreparation); Raster position; Internal(VCReload, VC, RC, VLMI, Idle); Preparation(Decoded, Mode, ScrollX, FlashPhase); Prepared output(P0, P1, P2, P3, P4, P5, P6, P7, Invalid); Clock(SingleClock, ForcedSingleClock, Freeze, SelectedPAL, PresentationPAL, PresentationPending, SelectedDivider, GraphicsCycleActive).",
      "timing": "One record at the end of beginTEDCycle for each enabled slow graphics pulse, after fetch/counter work and resetting or decoding the eight-entry output block. It uses the same event coordinate as the preceding Info Cycle: ordering within that phase comes from record order and Snapshot. No pixels have been emitted from the newly prepared block at this point.",
      "events": "Decoded is true exactly when drawGraphics ran (VideoActive and visible presentation position). Otherwise the reset transparent block is reported. P0..P7 use T for transparent, B0..B3 for unresolved global background references, Cn for literal palette index n in decimal. Invalid is the retained invalid-mode flag. Background references resolve at individual emission edges; they are not replaced with current palette colors in this record. Mode, ScrollX and FlashPhase describe preparation-time controls. These fields do not add latches or simulate a second decode. No per-pixel records or absolute TED clock are introduced."
    },
    {
      "name": "TED - CPU instruction transaction",
      "producer": "src/COMMODORE/TED/TED.cpp :: debugCPUAboutToExecute",
      "fields": "Transaction(Type=Instruction, Address, Code, Cycles); Bus cycles(StartCPU, IntrinsicCycles, ReadCycles, WriteCycles, FirstWriteCycle, LastReadCycle, TrailingWriteCycles); Raster origin(Row, Cycle); Clock(SingleClock).",
      "timing": "At instruction notification, before optional TED read advancement. The predicted duration selects the 7501 BusCycleData alternative. Bus indexes are zero-based. No future raster position is estimated by this record.",
      "events": "The prefix stops before the first write and leaves its final cycle before the TED read-capture edge (7 fast or 23 slow, zero-based quarter edges). Recovery retains cycle duration, input carry and NextQuarter. Writes execute at the final edge of their declared CPU cycles. Earlier reads within the atomic instruction and reads following writes are not individually synchronized."
    },
    {
      "name": "TED - CPU read advance",
      "producer": "src/COMMODORE/TED/TED.cpp :: CPUAboutToExecute / advanceToCPURead / debugCPUReadAdvance",
      "fields": "Timing(Reference=ObservedCPUClock, StartCPU, RecoveryCPU); Advance(Phase=Before|After, PreparedCPUCycles, NextQuarter, AccessPending); Raster position; Clock(HalfCarry); Timers.",
      "timing": "A pair surrounds pre-execution advancement of the readable instruction prefix. Header is the unchanged observed CPU clock. PreparedCPUCycles includes the final CPU cycle suspended before access. With N>0, RecoveryCPU after advancement is StartCPU+N-1 and AccessPending=1; N=0 leaves no suspended cycle. The CPU recovery cursor increments only on completion.",
      "events": "The prefix is min(lastReadCycle+1, firstWriteCycle), ignoring an absent bound. With a suspended cycle, NextQuarter is 7 fast or 23 slow. Recovery resumes at that edge without repeating earlier work. HalfCarry still describes completed CPU cycles; the suspended cycle output carry is committed only at completion. JSR/BRK reads after writes remain outside the prefix."
    },
    {
      "name": "TED - CPU interrupt transaction",
      "producer": "src/C264/C264.cpp :: processEvent / src/COMMODORE/TED/TED.cpp :: CPUAboutToExecute / debugCPUAboutToExecute",
      "fields": "Transaction(Type=Interrupt, Id); Bus cycles(StartCPU, IntrinsicCycles, ReadCycles, WriteCycles, FirstWriteCycle, LastReadCycle, TrailingWriteCycles); Raster origin(Row, Cycle).",
      "timing": "When the CPU accepts an interrupt and notifies its launch, before acknowledge and launch effects. Header and StartCPU identify the CPU clock at notification. Bus metadata describes the launch sequence. This is not emitted for each requestInterrupt call.",
      "events": "C264 forwards accepted launch notifications from its own CPU. Launch stack writes are replayed at declared bus indexes. This callback does not advance to vector reads because they follow stack writes; interrupt vector-read synchronization remains outside this step."
    },
    {
      "name": "TED - Frozen clock",
      "producer": "src/COMMODORE/TED/TED.cpp :: processCPUQuarter / debugFrozenTEDCycle",
      "fields": "Timing(CPUHalf, CPUQuarter, CPUQuarterLength, ClockDivider, MasterCycles, Reference=TEDPhaseEvent); Raster position; Clock distribution(RasterEnabled=0, TimersEnabled=0, SoundEnabled=1); Interrupt.",
      "timing": "One record at each completed slow-clock pulse whose graphics/timer gating was disabled at pulse start. Header + CPUQuarter/CPUQuarterLength identifies the event. The relative phase continues while counters are frozen.",
      "events": "Sound receives one pulse while automatic raster and timer advancement remains gated. Explicit counter writes are still accepted; a pending horizontal load can apply even while frozen. The sampled IRQ comparator remains active. A write changing FREEZE affects the next pulse, not the retained gating of the current one. Physical FREEZE acceptance and sound behavior still require hardware validation."
    },
    {
      "name": "TED - CPU write",
      "producer": "src/COMMODORE/TED/TED.cpp :: executePendingWriteAt / debugCPUWrite; src/C264/TED.cpp :: applyCPUWriteEffects",
      "fields": "Timing(Reference=ScheduledCPUCycle, ObservedCPUClock, BoundaryCPU, CPUQuarterLength, TEDPhase, PixelIndex, RetainedDivider, RetainedSingleClock); Transaction(Type=Instruction|Interrupt, StartCPU, WriteIndex); Memory access(Phase=Before|After, Subset, Address, Value); Raster position; Clock(SingleClock, ForcedSingleClock, Freeze, SelectedPAL, PresentationPAL, PresentationPending, SelectedDivider, GraphicsCycleActive); Output(GraphicsCycleActive, VideoActive, Visible, Screen, PixelIndex, PreparedCode, Invalid); Palette(Background0, Background1, Background2, Background3, Border); Interrupt.",
      "timing": "A pair surrounds the command and board effects at the final bus edge of its CPU cycle. Header is the zero-based CPU-cycle slot StartCPU+writeCycle(WriteIndex); BoundaryCPU is header+1. ObservedCPUClock is the executed batch end. After describes the command effect before coincident counter-clock processing. Both records precede pixel emission, presentation advancement and the counter-clock work on that edge. TEDPhase is the current slow-pulse quarter-dot edge index 0..31, not an absolute time; PixelIndex=TEDPhase>>2. CPUQuarterLength is 16 or 32. RetainedDivider and RetainedSingleClock remain unchanged by a write selecting a new profile. BoundaryCPU is the final bus-edge coordinate; do not apply the TEDPhaseEvent header convention to this record.",
      "events": "Writes retain order across CPU RAM aliases and I/O. ROM/RAM and C1/C2 effects update the map immediately; their changed latches are consumed. Audio-register writes and FF07 writes drain older queued sound pulses first. FF07 then selects the timing profile and updates nominal sound-clock information; the ending CPU cycle retains its captured divider. The command retains its capture-time subset; Address reconstructs its logical CPU address, not a newly decoded physical address. Instruction/interrupt duration and captured write count must match metadata; otherwise recovery reports an error. Vertical loads suppress a coincident pending vertical increment. FF1E queues a load for the following dot tick. FF1F suppresses a coincident FLASH clock. FF09 raster acknowledgement takes priority over retaining a newly sampled raster flag. PreparedCode uses T for transparent, B0..B3 for unresolved background references and Cn for literal palette index n (decimal). Palette values are decimal current register colors. Visible and Screen are presentation-window membership, not guarantees of output: VideoActive and the retained graphics gate also apply. Before/After changes show register effects preceding the same output edge, without claiming PreparedCode is an emitted color. A write may change palette, border or geometry while prepared graphics remain retained."
    },
    {
      "name": "TEDRegisters - Register write observed",
      "producer": "src/COMMODORE/TED/TEDRegisters.cpp :: debugRegisterWrite",
      "fields": "Timing(Reference=ObservedCPUClock, RasterReference=CurrentUnsynchronizedTED, Origin=Unknown); Register access(Phase=Before|After, Address, Register, Written); Raster position(Row, Column); Register effect(VCReload, RC, Flash, RasterRegisterRow, RasterRegisterColumn, ScrollX, ScrollY, DisplayEnabled, Mode, ForcedSingleClock, Freeze, KeyboardLatch); Memory bases and ROM selections; Timers(T1/T2/T3 Counter and Reload); Interrupt.",
      "timing": "Two records surround each core setValue operation. No physical bus-write cycle or CPU/debugger origin is inferred. Initialization is suppressed until a diagnostic CPU link is available. Enable TED chip 101 to establish the link and TED register memory subset 1010 (or ALLMEM) to emit the records.",
      "events": "Before/after covers the common setValue operation. Written data is not readback. Raster position and RasterRegisterRow/Column use effective counters. FF1C/FF1D replace part of the live vertical counter. FF1E queues its inverted horizontal load and has no immediate counter effect. Origin remains unknown; correlate with scheduled CPU write pairs."
    },
    {
      "name": "TEDRegisters - Register read observed",
      "producer": "src/COMMODORE/TED/TEDRegisters.cpp :: readRegisterValue / debugRegisterRead",
      "fields": "Timing(Reference, RasterReference, Origin=Unknown); Register access(Address, Register, Returned); Raster position; Interrupt.",
      "timing": "Decoded registers 00-05, 09-0B and 1A-1F, after calculating the original result without another read. Requires the same CPU link and memory selection as write records.",
      "events": "Only the observed readValue path emits this record. peekValue and peekRegister, including valueRegisters/getInfoStructure inspection, use the same decoder without emitting register-read diagnostics; sound fields use the wrapper peekValue path. Origin remains Unknown because non-CPU callers can still use readValue; this distinction does not establish a physical bus-read timestamp. FF0A.0/FF0B read the comparator; FF1C/FF1D read the effective vertical counter; FF1E returns (H >> 1) & FE. Connected-mode final reads observe the state paused before capture edge 7 or 23. No free-running extra vertical-read delay is modeled; unsynchronized inspection sees the current state without advancing it or emitting an observed-read record. The returned reference still uses a mutable result buffer; this is not hardware state advancement."
    },
    {
      "name": "SoundFunction - Sound batch",
      "producer": "src/COMMODORE/TED/TED.cpp :: SoundFunction::simulatePendingCycles / debugSoundBatch",
      "fields": "Timing(Reference=ObservedCPUClock|ScheduledCPUCycle, Cause=ChipSimulation|BeforeCPUWrite, ObservedCPUClock); Sound timing(ClockSource=TEDScheduler, Unit=SlowTEDCycle, PendingCyclesBefore, CyclesProcessed, MasterCyclesProcessed, MasterHz, SamplesGenerated).",
      "timing": "Before clearing pending sound pulses. Regular chip simulation uses observed CPU time in the header. BeforeCPUWrite uses the scheduled CPU write cycle in the header and retains the observed CPU clock in Timing. The scheduled coordinate identifies the write boundary, not individual sample timestamps. Pending and processed counts are complete slow TED pulses already supplied by the common scheduler; neither entry point advances the scheduler.",
      "events": "Select chip 1010 or ALLCHIP. BeforeCPUWrite precedes the matching CPU write Before/After pair for FF07 and FF0E-FF12. Older queued pulses use the preceding audio parameters. Zero-pulse batches are retained to identify consecutive write boundaries, including RMW writes. SamplesGenerated counts bytes from successful getDataForTEDCycle calls (mono AUDIO_U8). MasterCyclesProcessed sums the elapsed crystal clocks of the consumed pulses; MasterHz is the fixed board crystal frequency. Pulses retain their individual elapsed durations across divider changes, including an 18-clock pulse formed by 10-clock and 8-clock halves. The integer sample phase survives divider changes. This follows the retained CPU-period simulation contract, not a measured analog divider-switch transient."
    },
    {
      "name": "ROMRAMSwitch — direct line",
      "producer": "src/C264/ROMRAMSwitch.cpp :: debugROMRAMSwitchCycle",
      "fields": "Component FF3E/FF3F,X; CPU cycle; Info cycle; ROM Active:YES|NO.",
      "timing": "Legacy fallback when configurationChanged() is consumed by the standalone selector chip. In scheduled CPU writes, the C264 TED hook applies and consumes the change immediately, so this later selector record is normally absent.",
      "events": "CPU write Before/After records identify scheduled selector writes. Setup or unscheduled accesses may still use this legacy tab-separated format."
    },
    {
      "name": "C1C2Selector — direct line",
      "producer": "src/C264/C1C2Selector.cpp :: debugC1C2SelectorCycle",
      "fields": "Component FDD0/FDDF,X; CPU cycle; Info cycle; Memory Cfg:number.",
      "timing": "Legacy fallback when configurationChanged() is consumed by the standalone selector chip. In scheduled CPU writes, the C264 TED hook applies and consumes the change immediately, so this later selector record is normally absent.",
      "events": "CPU write Before/After records identify scheduled selector writes. Setup or unscheduled accesses may still use this legacy tab-separated format."
    },
    {
      "name": "Datasette 1531 / SerialIO",
      "producer": "src/C264/1531Datasette.cpp and src/COMMODORE/SerialIOPeripherals.cpp",
      "fields": "Header/data found, block, simulation state, error or missing data; serial-bus transitions.",
      "timing": "CPU cycle of the trap or transition.",
      "events": "May mix subordinate text and complete headers."
    },
    {
      "name": "C264 - Clock pacing",
      "producer": "src/C264/C264.cpp :: clockCyclesForPacing / debugClockPacing",
      "fields": "Timing(Reference=ObservedCPUClock); Pacing(Unit=MasterClock, CPUCycles, ChargedCycles); Clock(BaseHz, Factor).",
      "timing": "Once after chip simulation and before the iteration separator (+), when machine deep debug is active. The header is the observed CPU clock. The machine consumes the accumulated duration of completed recovered CPU cycles, including work prepared before CPU execution.",
      "events": "ChargedCycles is recovered elapsed time in board crystal clocks: a completed fast CPU cycle contributes 10 clocks with the PAL divider or 8 with the NTSC divider; a slow cycle contributes 20 or 16. CPUCycles is the generic CPU work count supplied by Computer. A suspended pre-access cycle is charged only when completed. BaseHz is the fixed board crystal (17734475 Hz for a PAL board or 14318180 Hz for an NTSC board); FF07 does not replace that crystal. Factor scales the host pacing target. This is an elapsed-time budget, not an absolute TED clock."
    }
