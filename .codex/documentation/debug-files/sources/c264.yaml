      "timing": "Two records surround each core setValue operation. No physical bus-write cycle or CPU/debugger origin is inferred. Initialization is suppressed until a diagnostic CPU link is available. Enable TED chip 101 to establish the link and TED register memory subset 1010 (or ALLMEM) to emit the records.",
