  "records": [
    {
      "name": "TED - Info Cycle",
      "producer": "src/COMMODORE/TED/TED.cpp :: debugCycleContext / debugTEDCycle",
      "fields": "Timing(CPUHalf, CPUQuarter, CPUQuarterLength, ClockDivider, MasterCycles, Reference=TEDPhaseEvent, Snapshot=BeforeGraphics, CPUBatchStart, CPUBatchEnd, CPUBatchIndex, CPUBatchCycles, ConversionSingleClock, HalfCarryIn, HalfCarryOut); Raster position(Column, ColumnBase0, Row, RowBase0, Cycle, CounterColumn, CounterRow, VideoLine, CounterCycle); Internal(VCReload, VC, RC, VLMI, Idle); Display(DisplayEnabled, VideoActive, ScrollX, ScrollY, Rows25, Columns40); Badline(Latched, LastScrollY, WithinBadlineRange); Clock(SingleClock, ForcedSingleClock, ExternalFetchClock, RefreshClock, Freeze, SelectedPAL, PresentationPAL, PresentationPending, SelectedDivider, GraphicsCycleActive, VerticalWindow, HorizontalWindow, EffectiveControl1, EffectiveControl2, DMAState, DMAWindow, BA, DMABusGranted); Graphics mode(Mode); Memory(Screen, Attributes, Characters, Bitmap, CPUROMActive, GraphicsROMSelected); Timers; Interrupt.",
      "timing": "Before retained row-end and display-control work at the beginning of an enabled slow-clock pulse. Event coordinate = header + CPUQuarter/CPUQuarterLength. CPUQuarterLength is 16 for a fast CPU cycle or 32 for a slow one; one unit is a quarter dot. CPUHalf identifies the containing half and is not the exact fraction. CPUBatchIndex is the elapsed recovered CPU-period offset from CPUBatchStart and includes DMA waits; it is not the logical instruction-cycle index. CPUBatchCycles is CPUBatchEnd minus CPUBatchStart. During read preparation, CPUBatchEnd is the planned nominal boundary, so CPUBatchIndex can reach or exceed CPUBatchCycles while recovering waits. LogicalCycle in transaction records excludes those waits. HalfCarryIn/Out describe the individual CPU cycle; no absolute TED clock is stored. ClockDivider is the divisor captured at CPU-cycle start (20 PAL or 16 NTSC); MasterCycles is the crystal-clock duration of that entire CPU cycle, not an event timestamp. A write within the cycle does not retroactively change these retained values. beginTEDCycle retains cycle-57 row-end work and display/badline controls; it no longer resets or decodes pixel output. Captures and cell transfers run at phases 15/31, and the pixel shift register loads separately at the sampled horizontal-scroll boundary.",
      "events": "Raster Row/Column and their Base0 variants describe presentation geometry. CounterRow/CounterColumn are the programmable hardware counters; VideoLine is their internal vertical capture. Cycle retains the existing graphics-cycle position at pulse start; CounterCycle is derived from live horizontal position and is zero outside 0..455. Timers and Interrupt retain their existing field encodings. Match Info Cycle to the next Info Cycle End in traversal order: their phase coordinates differ and may belong to different fast CPU cycles. SelectedDivider and SelectedPAL describe the current profile, whereas Timing.ClockDivider and ConversionSingleClock describe the retained CPU cycle. PresentationPAL describes the applied framebuffer geometry; PresentationPending means selected and applied profiles differ. GraphicsCycleActive is the retained slow-pulse gate, not a second FREEZE register. WithinBadlineRange now denotes VideoLine < 203, matching the attribute-capture range. Display.ScrollY remains the live register; the accepted badline record reports the sampled scroll. Clock.VerticalWindow is the retained permission to open the horizontal window; HorizontalWindow is that retained window. Neither is a geometric range test. They show the state at the logging point, which precedes the current dot comparison in a beginning-of-pulse snapshot. Graphics mode.Mode and Memory.Characters describe programmed register configuration. Clock.EffectiveControl1 is FF06 masked by 60 hexadecimal; EffectiveControl2 is FF07 masked by 90 hexadecimal, both printed in decimal. They select output interpretation and new graphics-address preparation. They update after output and counter work at phase 31, including frozen pulses. Programmed readback remains unchanged. Existing pending addresses are never recalculated from the new mode; the fetch Address remains authoritative. Clock.ExternalFetchClock and RefreshClock are retained horizontal windows, independent of DMA ownership and address preparation. H=296 closes external fetching and opens refresh, H=336 closes refresh, and H=400 opens external fetching. The slow-clock decision is FREEZE or forced slow or refresh or (retained display enable and external fetching). It is accepted at the completed slow boundary for following CPU periods. Programmed-counter jumps retain windows when their comparator was skipped. Initial windows are false, a deterministic emulator initialization rather than measured power-on state."
    },
    {
      "name": "TED - Info Cycle End",
      "producer": "src/COMMODORE/TED/TED.cpp :: debugTEDCycleEnd",
      "fields": "Timing(CPUHalf, CPUQuarter, CPUQuarterLength, ClockDivider, MasterCycles, Reference=TEDPhaseEvent, Snapshot=AfterGraphics); Raster position; Internal; Clock(SingleClock, ForcedSingleClock, ExternalFetchClock, RefreshClock, Freeze, SelectedPAL, PresentationPAL, PresentationPending, SelectedDivider, GraphicsCycleActive, VerticalWindow, HorizontalWindow, EffectiveControl1, EffectiveControl2, DMAState, DMAWindow, BA, DMABusGranted); Timers; Interrupt, including CPURequestClockArgument.",
      "timing": "After completing the slow pulse, including its eight individual dot emissions, counter work, timers and IRQ propagation. Header + CPUQuarter/CPUQuarterLength is this event coordinate. It differs from the beginning-of-graphics coordinate. Raster geometry shows the next presentation position.",
      "events": "CPURequestClockArgument is the integer CPU-cycle slot C passed to requestInterrupt, or a dash. The API has no quarter-dot argument; exact diagnostic phase coordinates do not imply finer CPU interrupt-entry support. A held request is not a new edge. FREEZE is the live register; graphics/timer gating is retained for the entire slow pulse. Output now consumes retained cells across pulse boundaries; a newly loaded cell at this edge can begin emission in the next slow pulse. This snapshot does not imply that all pixels of that cell have already been emitted. EffectiveControl1/2 have accepted programmed controls at this completed slow boundary; an earlier Video output loaded record on the same edge can show the preceding controls. Clock window fields show the horizontal latch states at this logging point. SingleClock is still the preceding accepted decision because processCPUQuarter updates it after finishTEDCycle and this record. The next Info Cycle shows the newly accepted decision. The active CPU period always keeps its captured timing."
    },
    {
      "name": "TED - Raster event",
      "producer": "src/COMMODORE/TED/TED.cpp :: finishTEDCycle / processCPUQuarter / processRasterControl / clockRasterDot / debugRasterEvent / clockDMA",
      "fields": "Timing(CPUHalf, CPUQuarter, CPUQuarterLength, ClockDivider, MasterCycles, Reference=TEDPhaseEvent); Event(Kind, SourceLine); Raster position(Column, ColumnBase0, Row, RowBase0, Cycle, CounterColumn, CounterRow, VideoLine, CounterCycle); Clock(SingleClock, ForcedSingleClock, ExternalFetchClock, RefreshClock, Freeze, SelectedPAL, PresentationPAL, PresentationPending, SelectedDivider, GraphicsCycleActive, VerticalWindow, HorizontalWindow, EffectiveControl1, EffectiveControl2, DMAState, DMAWindow, BA, DMABusGranted); Pending(VerticalClock, FlashClock, HorizontalWrite); Interrupt.",
      "timing": "Header + CPUQuarter/CPUQuarterLength identifies the event edge. Kind is VideoLineLatch, VerticalClock, HorizontalLoad, FlashClock, RasterIRQ, RasterConfiguration, FrameReady, DMAWarning, DMABusGranted or DMABusReleased. SourceLine is the previous capture, previous counter, current line or sampled IRQ operand as appropriate.",
      "events": "H=384 arms a vertical event consumed at the next slow boundary, with CPU load priority. H=392 captures VideoLine; the previous capture qualifies the end-of-screen character-reload reset. H=348 arms FLASH, clocked at the next slow boundary if VideoLine=205. Normal effective positions are V at 391->392 and FLASH at 351->352. Horizontal load occurs one dot after its write and preserves evolving low phase. Counter return uses EOS=311 PAL/261 NTSC; other values retain nine-bit overflow. RasterIRQ records a newly retained flag, including masked events. Pending fields are snapshots at the logging point, not a promise that later processing on the same edge has finished. RasterConfiguration is emitted after applying the selected presentation profile at H=392, when the newly captured VideoLine equals its vertical firstPosition (PAL 260, NTSC 235 by default). SourceLine is that captured line. It replaces and clears the framebuffer without resetting hardware counters or CPU-cycle phase; Raster Row/Column now use the applied geometry. Presentation advances one dot at each emission edge. On dot-clock edges, a scheduled CPU write executes before pixel emission and presentation advancement, then clockRasterDot advances the hardware counters. Consequently a RasterIRQ, VerticalClock, HorizontalLoad or FlashClock record after that edge shows the advanced presentation coordinate. Control-edge events retain their position before the next emission. This is the implemented ordering, not a measured video-output latency. FlashClock advances the shared five-bit FLASH counter; cursor visibility in standard text is derived from bit 4 being clear, while attribute blinking uses bit 4 being set. There is no separate screen-frequency cursor divider. FrameReady is logged after setting the last-VBlank entry latch and immediately before notifying GRAPHICSREADY. It records emulator image availability, not physical VSYNC or host presentation. SourceLine is the current VideoLine; Clock identifies selected and applied presentation profiles. At enabled phase 31, before a coincident CPU write, the pending vertical event retains the preceding attribute condition as the next character-code line, then ScrollY samples the register. H=392 resets RC and leaves graphics idle for a retained character-code line below 204 while display is active. The previous VideoLine=205 clears the separate matrix/attribute address reload. H=392 now clears graphics working VC on every captured line; the end-of-screen condition still clears its reload separately. H=432 opens the fetch window and reloads graphics VC; matrix/attribute position reloads there when display is active. H=296 closes preparation without cancelling a graphics read already pending. These window controls do not add new Raster event kinds. H=440 opens retained-cell transfers only when display enable is retained; a disabled display does not close a transfer latch whose H=311 closing event was skipped. Preparation clears next graphics and the character/attribute/graphics bytes of current and waiting, preserving their cursor and validity metadata. It leaves the output shift register, its diagnostic index and multicolor pair phase unchanged. After emission at H=311, shift activity stops; the retained horizontal window can finish consuming the last retained output cell through H=319 in the default 40-column configuration. These controls add no new Raster event kinds. Default active output is H=0..319 and V=4..203, or H=8..311 and V=8..199 with reduced screen dimensions. The default horizontal presentation crop is 424..351; visible dimensions remain 384 columns, PAL 284 rows and NTSC 234 rows. DMAWarning records lead-state transitions, DMABusGranted records completed lead time, and DMABusReleased records cancellation or release. DMAState is 0 idle, 1/2/3 lead intervals, 4 granted. BA=1 means no DMA request. DMABusGranted describes ownership of the CPU bus phase, not the full electrical AEC waveform. The request window opens after H=407 and closes after the H=295 capture, separately from address generation at H=432..296. With TEDEVENTS enabled, an accepted RasterIRQ retains its sampled line and presentation row even outside the horizontal crop, provided that row is vertically visible. Its full-width overlay is composed after the visible row completes; a later write to FF0B does not change that captured label. The overlay is a history of accepted events, distinct from the live programmed comparator."
    },
    {
      "name": "TED - Badline detected",
      "producer": "src/COMMODORE/TED/TED.cpp :: debugBadLine",
      "fields": "Timing(CPUHalf, CPUQuarter, CPUQuarterLength, ClockDivider, MasterCycles, Reference=TEDPhaseEvent); Raster position; Internal; Badline(Latched, ScrollY, VideoActive, Cause=ScrollMatch).",
      "timing": "After accepting the attribute-line condition in beginTEDCycle, using display enable, VideoLine < 203 and the scroll sampled at slow phase 31. The diagnostic phase is the beginning-of-graphics event.",
      "events": "WithinBadlineRange uses the captured internal VideoLine. Badline.ScrollY is the retained sample, not the live FF06 value. Acceptance latches the condition and optional visible TEDEVENTS marker; it no longer resets RC or leaves idle. Those graphics actions occur at H=392 when the retained second-line condition qualifies the newly captured line. The marker does not identify a completed RAM capture. This record remains the initial accepted condition. TEDEVENTS transfer groups instead come from actual granted matrix/attribute captures and can recur throughout the transfer interval."
    },
    {
      "name": "TED - Video matrix read",
      "producer": "src/COMMODORE/TED/TED.cpp :: captureVideoRead / debugReadingVideoMatrix",
      "fields": "Timing(CPUHalf, CPUQuarter, CPUQuarterLength, ClockDivider, MasterCycles, Reference=TEDPhaseEvent); Raster position; Fetch(VCReload, VC, RC, VLMI, Idle); Matrix(Address, BufferIndex, Value, Source=RAM).",
      "timing": "At phase 31 inside clockVideoFetch / captureVideoRead, after updating the enabled character-code buffer from the pending RAM read. Capture precedes graphics-address preparation, address/index increments, next-line/scroll sampling and a coincident scheduled CPU write. Phase 31 is relative to one slow TED pulse, independent of CPU single/double speed.",
      "events": "Address and BufferIndex come from PendingVideoRead, prepared at the preceding phase 15; Value is already captured, with no diagnostic memory access. Capture enables are evaluated at phase 31, independently of the address previously selected. Attributes use the sampled-scroll condition; character codes use the condition retained from the preceding line. If both enables coincide, the selected bus byte updates both buffers; attribute is logged before matrix. A pending plane read completing with no enabled buffer destination produces neither record. Matrix/attribute addresses use their separate ten-bit position, not graphics VC. BufferIndex circulates 0..39 at each open-window phase 31 and is not reconstructed from H. Physical aliases and actual CPU bus ownership are not reported. Cell transfer preserves the attribute byte from before this buffer update, while the next cell character uses the code available after capture. Cursor matching and cell validity are retained with those operands before graphics VC advances; output does not reread these buffers by screen position. RAM capture additionally requires DMA ownership. An ungranted opportunity is discarded without overwriting retained bytes; circular output circulation and graphics fetches retain their own conditions."
    },
    {
      "name": "TED - Video attributes read",
      "producer": "src/COMMODORE/TED/TED.cpp :: captureVideoRead / debugReadingVideoAttributes",
      "fields": "Timing(CPUHalf, CPUQuarter, CPUQuarterLength, ClockDivider, MasterCycles, Reference=TEDPhaseEvent); Raster position; Fetch(VCReload, VC, RC, VLMI, Idle); Attribute(Address, BufferIndex, Value, Source=RAM).",
      "timing": "At phase 31 inside clockVideoFetch / captureVideoRead, after updating the enabled attribute buffer from the pending RAM read. Capture precedes graphics-address preparation, address/index increments, next-line/scroll sampling and a coincident scheduled CPU write. Phase 31 is relative to one slow TED pulse, independent of CPU single/double speed.",
      "events": "Address and BufferIndex come from PendingVideoRead, prepared at the preceding phase 15; Value is already captured, with no diagnostic memory access. Capture enables are evaluated at phase 31, independently of the address previously selected. Attributes use the sampled-scroll condition; character codes use the condition retained from the preceding line. If both enables coincide, the selected bus byte updates both buffers; attribute is logged before matrix. A pending plane read completing with no enabled buffer destination produces neither record. Matrix/attribute addresses use their separate ten-bit position, not graphics VC. BufferIndex circulates 0..39 at each open-window phase 31 and is not reconstructed from H. Physical aliases and actual CPU bus ownership are not reported. Cell transfer preserves the attribute byte from before this buffer update, while the next cell character uses the code available after capture. Cursor matching and cell validity are retained with those operands before graphics VC advances; output does not reread these buffers by screen position. RAM capture additionally requires DMA ownership. An ungranted opportunity is discarded without overwriting retained bytes; circular output circulation and graphics fetches retain their own conditions."
    },
    {
      "name": "TED - Graphics read",
      "producer": "src/COMMODORE/TED/TED.cpp :: captureVideoRead / debugReadingGraphics",
      "fields": "Timing(CPUHalf, CPUQuarter, CPUQuarterLength, ClockDivider, MasterCycles, Reference=TEDPhaseEvent); Raster position; Fetch; Memory access(Kind, Source, Address, BufferIndex, Value).",
      "timing": "At phase 15 inside clockVideoFetch / captureVideoRead, after storing the graphics byte and before invalidating its pending descriptor, preparing another plane address or executing a coincident scheduled CPU write. Its address and destination were prepared at the preceding phase 31. A final pending read still completes after H=296 closes the preparation window.",
      "events": "Kind is Idle, Character or Bitmap. Source is TEDView for idle reads; ROM or RAM describes the graphics map selection used at capture, not an identified physical chip or resolved RAM alias. A coincident CPU write occurs after capture. Kind, Address and BufferIndex are retained from address selection; Value is the returned byte. CharacterCode, CharacterMask and CharacterIndex are not reconstructed. Fetch.VC may already have advanced when the address was prepared; the retained Address is authoritative. Before capture, the prior next-graphics byte advances to the current cell when shifts are active; the captured byte then replaces next graphics. At phase 31, the current complete cell is copied to waiting before its metadata advances. Output loads only that retained waiting cell, independently of subsequent buffer changes. New address selection uses effective ECM/bitmap/reverse controls. Character-base alignment uses raw programmed FF13 and effective reverse; it does not reconstruct the base from mode-masked readback."
    },
    {
      "name": "TED - Video output loaded",
      "producer": "src/COMMODORE/TED/TED.cpp :: clockVideoOutput / debugVideoOutputLoad / debugVideoOutputAsString",
      "fields": "Timing(CPUHalf, CPUQuarter, CPUQuarterLength, ClockDivider, MasterCycles, Reference=TEDPhaseEvent, Snapshot=AfterLoadBeforeControls); Raster position; Internal(VCReload, VC, RC, VLMI, Idle); Output(Graphics, Character, Attribute, CursorMatch, Valid, PixelIndex, DoubleShift, ScrollX, Multicolor, FlashPhase, PixelColor); Clock(SingleClock, ForcedSingleClock, ExternalFetchClock, RefreshClock, Freeze, SelectedPAL, PresentationPAL, PresentationPending, SelectedDivider, GraphicsCycleActive, VerticalWindow, HorizontalWindow, EffectiveControl1, EffectiveControl2, DMAState, DMAWindow, BA, DMABusGranted).",
      "timing": "Emitted after clockVideoOutput loads the retained waiting cell into the pixel shift register, after current-dot emission and before raster movement. Load condition is (CounterColumn + 1) modulo 8 equals retained ScrollX while shifting or the horizontal border window is open. A load has priority over shifting. The loaded byte begins output on the following dot. Snapshot=AfterLoadBeforeControls means effective mode acceptance at a coincident slow boundary has not yet happened; a subsequent dot can use different effective controls.",
      "events": "Graphics, Character and Attribute are hexadecimal retained output bytes. Graphics already includes cursor inversion when the load qualifies as standard character mode with FLASH bit 4 clear. CursorMatch retains the comparison flag, not a promise of later inversion. Valid identifies retained operands; invalid operands resolve to background 0. PixelIndex is the diagnostic dot count since the last load, modulo 8; DoubleShift is the pair phase used by the next shift, reset to zero on load. ScrollX is the retained value that selected this load, before end-of-edge resampling. Multicolor describes the current effective shift decision, including the retained attribute bit. FlashPhase and PixelColor are inspection-time values; PixelColor is a decimal content palette index before border/display gating, not an emitted pixel or a prediction of eight following pixels. There are no P0..P7, PreparedCode or Invalid fields. Default scroll-zero cell 0 captures graphics at H=443, advances them at 451, loads at 455 and starts output at H=0; the last cell loads at 311 and emits at 312..319. Loads can continue beyond the normal rectangle through an open horizontal window. Disabled cell transfers zero waiting graphics while retaining metadata. Each active non-load dot toggles DoubleShift even in hires: hires shifts one bit; multicolor shifts two only when the preceding DoubleShift is one. Shifted-in bits are zero."
    },
    {
      "name": "TED - CPU instruction transaction",
      "producer": "src/COMMODORE/TED/TED.cpp :: debugCPUAboutToExecute",
      "fields": "Transaction(Type=Instruction, Address, Code, Cycles); Bus cycles(StartCPU, IntrinsicCycles, ReadCycles, WriteCycles, FirstWriteCycle, LastReadCycle, TrailingWriteCycles); Raster origin(Row, Cycle); Clock(SingleClock). Bus-cycle state also includes LogicalCycle, WaitCycles, WritesExtracted and StopRequested.",
      "timing": "At instruction notification, before optional TED read advancement. The predicted duration selects the 7501 BusCycleData alternative. Bus indexes are zero-based. No future raster position is estimated by this record.",
      "events": "The prefix stops before the first write and leaves its final cycle before the TED read-capture edge (7 fast or 23 slow, zero-based quarter edges). Recovery retains cycle duration, input carry and NextQuarter. Writes execute at the final edge of their declared CPU cycles. Earlier reads within the atomic instruction and reads following writes are not individually synchronized."
    },
    {
      "name": "TED - CPU read advance",
      "producer": "src/COMMODORE/TED/TED.cpp :: CPUAboutToExecute / advanceToCPURead / debugCPUReadAdvance",
      "fields": "Timing(Reference=ObservedCPUClock, StartCPU, RecoveryCPU); Advance(Phase=Before|After, PreparedCPUCycles, NextQuarter, AccessPending, AccessHeld, LogicalCycle, WaitCycles); Raster position; Clock(HalfCarry); Timers.",
      "timing": "A pair surrounds pre-execution recovery of the readable instruction prefix. Header is the unchanged observed CPU clock. PreparedCPUCycles is a logical bus-cycle count. With N>0 and no waits, RecoveryCPU=StartCPU+N-1 and AccessPending=1. With DMA, RecoveryCPU also includes completed waits and can exceed the observed or planned CPU boundary. LogicalCycle excludes waits; AccessHeld identifies a blocked access. A frozen asserted DMA request yields early to the stop scheduler rather than spinning inside the notification.",
      "events": "The prefix is min(lastReadCycle+1, firstWriteCycle), ignoring an absent bound. With a suspended cycle, NextQuarter is 7 fast or 23 slow. Recovery resumes at that edge without repeating earlier work. HalfCarry still describes completed CPU cycles; the suspended cycle output carry is committed only at completion. JSR/BRK reads after writes remain outside the prefix. Waits do not consume a logical read or advance the pending write index. Already recovered time is not simulated again during CPU compensation ticks. CPU semantics remain instruction-granular."
    },
    {
      "name": "TED - CPU interrupt transaction",
      "producer": "src/C264/C264.cpp :: processEvent / src/COMMODORE/TED/TED.cpp :: CPUAboutToExecute / debugCPUAboutToExecute",
      "fields": "Transaction(Type=Interrupt, Id); Bus cycles(StartCPU, IntrinsicCycles, ReadCycles, WriteCycles, FirstWriteCycle, LastReadCycle, TrailingWriteCycles); Raster origin(Row, Cycle). Bus-cycle state also includes LogicalCycle, WaitCycles, WritesExtracted and StopRequested.",
      "timing": "When the CPU accepts an interrupt and notifies its launch, before acknowledge and launch effects. Header and StartCPU identify the CPU clock at notification. Bus metadata describes the launch sequence. This is not emitted for each requestInterrupt call.",
      "events": "C264 forwards accepted launch notifications from its own CPU. Launch stack writes are replayed at declared bus indexes. This callback does not advance to vector reads because they follow stack writes; interrupt vector-read synchronization remains outside this step."
    },
    {
      "name": "TED - CPU DMA stop",
      "producer": "src/COMMODORE/TED/TED.cpp :: updateCPUStop / debugCPUStop",
      "fields": "Timing(Reference=ObservedCPUClock, RecoveryCPU); Bus cycles(StartCPU, IntrinsicCycles, ReadCycles, WriteCycles, FirstWriteCycle, LastReadCycle, TrailingWriteCycles, LogicalCycle, WaitCycles, WritesExtracted, StopRequested); CPU stop(FirstStopCPU, RemainingCycles); Raster position; Clock(SingleClock, ForcedSingleClock, ExternalFetchClock, RefreshClock, Freeze, SelectedPAL, PresentationPAL, PresentationPending, SelectedDivider, GraphicsCycleActive, VerticalWindow, HorizontalWindow, EffectiveControl1, EffectiveControl2, DMAState, DMAWindow, BA, DMABusGranted).",
      "timing": "First stop request for a retained transaction, after semantic CPU execution. Header is the observed CPU clock; FirstStopCPU is the historical start of the first held access or implicit next-opcode hold. RemainingCycles excludes wait ticks already consumed by the CPU. The record is not emitted on every one-tick extension.",
      "events": "setStop is used outside CPUAboutToExecute. Recovery may already be ahead because of the read prefix. While the CPU catches up, the TED skips those recovered periods. A completed instruction reserves a single stop tick while BA still blocks its next opcode. Actual wait ticks update the same transaction and shift later writes. The existing CPU stop records expose later remaining-counter adjustments; no fixed 40/43-cycle penalty or separate raster prediction is used."
    },
    {
      "name": "TED - Frozen clock",
      "producer": "src/COMMODORE/TED/TED.cpp :: processCPUQuarter / debugFrozenTEDCycle",
      "fields": "Timing(CPUHalf, CPUQuarter, CPUQuarterLength, ClockDivider, MasterCycles, Reference=TEDPhaseEvent); Raster position; Clock distribution(RasterEnabled=0, TimersEnabled=0, SoundEnabled=1); Interrupt.",
      "timing": "One record at each completed slow-clock pulse whose graphics/timer gating was disabled at pulse start. Header + CPUQuarter/CPUQuarterLength identifies the event. The relative phase continues while counters are frozen.",
      "events": "Sound receives one pulse while automatic raster and timer advancement remains gated. Explicit counter writes are still accepted; a pending horizontal load can apply even while frozen. The sampled IRQ comparator remains active. A write changing FREEZE affects the next pulse, not the retained gating of the current one. Physical FREEZE acceptance and sound behavior still require hardware validation."
    },
    {
      "name": "TED - CPU write",
      "producer": "src/COMMODORE/TED/TED.cpp :: executePendingWriteAt / debugCPUWrite; src/C264/TED.cpp :: applyCPUWriteEffects",
      "fields": "Timing(Reference=ScheduledCPUCycle, ObservedCPUClock, BoundaryCPU, CPUQuarterLength, TEDPhase, PixelIndex, RetainedDivider, RetainedSingleClock); Transaction(Type=Instruction|Interrupt, StartCPU, WriteIndex, LogicalCycle, WaitCycles); Memory access(Phase=Before|After, Subset, Address, Value); Raster position; Clock(SingleClock, ForcedSingleClock, ExternalFetchClock, RefreshClock, Freeze, SelectedPAL, PresentationPAL, PresentationPending, SelectedDivider, GraphicsCycleActive, VerticalWindow, HorizontalWindow, EffectiveControl1, EffectiveControl2, DMAState, DMAWindow, BA, DMABusGranted); Output(GraphicsCycleActive, VideoActive, Visible, Screen, Graphics, Character, Attribute, CursorMatch, Valid, PixelIndex, DoubleShift, ScrollX, Multicolor, FlashPhase, PixelColor); Palette(Background0, Background1, Background2, Background3, Border); Interrupt.",
      "timing": "A pair surrounds the command and board effects at the final bus edge of its CPU cycle. Header is the zero-based CPU-cycle slot StartCPU+writeCycle(WriteIndex)+WaitCycles; BoundaryCPU is header+1. ObservedCPUClock is the current observed CPU boundary, including consumed stop ticks. After describes the command effect before coincident counter-clock processing. Both records precede pixel emission, presentation advancement and the counter-clock work on that edge. TEDPhase is the current slow-pulse quarter-dot edge index 0..31, not an absolute time; Timing.PixelIndex=TEDPhase>>2; Output.PixelIndex is the independent diagnostic count since the last shift-register load. CPUQuarterLength is 16 or 32. RetainedDivider and RetainedSingleClock remain unchanged by a write selecting a new profile. BoundaryCPU is the final bus-edge coordinate; do not apply the TEDPhaseEvent header convention to this record. The scheduled coordinate is StartCPU plus the declared write-cycle offset plus preceding WaitCycles. A held physical cycle cannot execute the pending command. Commands are extracted once and retained across CPU stop ticks.",
      "events": "Writes retain order across CPU RAM aliases and I/O. ROM/RAM and C1/C2 effects update the map immediately; their changed latches are consumed. Audio-register writes and FF07 writes drain older queued sound pulses first. FF07 then selects the timing profile and updates nominal sound-clock information; the ending CPU cycle retains its captured divider. The command retains its capture-time subset; Address reconstructs its logical CPU address, not a newly decoded physical address. Instruction/interrupt duration and captured write count must match metadata; otherwise recovery reports an error. Vertical loads suppress a coincident pending vertical increment. FF1E queues a load for the following dot tick. FF1F suppresses a coincident FLASH clock. FF09 raster acknowledgement takes priority over retaining a newly sampled raster flag. Output contains the live pixel shift register and retained metadata. PixelColor is a decimal content palette index evaluated at the logging point, before border/display gating, not a guaranteed emitted color. Palette values are decimal current register colors. Visible and Screen are geometric membership flags. Before/After surrounds the command; neither record includes the later shift-register advance, load or effective-control acceptance. Mode writes update programmed registers while Clock.EffectiveControl1/2 retain the preceding controls until after output at phase 31. Colors and explicit FLASH writes can change PixelColor before the same output edge. Output.Screen remains the RasterData geometric screen flag. Clock.VerticalWindow and HorizontalWindow are the retained border latches; the write Before/After records precede the border comparison for the current emitted dot."
    },
    {
      "name": "TEDRegisters - Register write observed",
      "producer": "src/COMMODORE/TED/TEDRegisters.cpp :: debugRegisterWrite",
