{
  "id": "c64",
  "title": "Commodore 64 DEBUG File",
  "subtitle": "Structure, fields, and interpretation criteria",
  "output": "docs/C64Data/C64_DEBUG_File_Format.docx",
  "models": "Commodore 64 PAL and NTSC; console and console-free executables.",
  "cpu": "MOS 6510 (6500 family).",
  "components": [
    ["200", "CIA1", "CIA cycle and keyboard/joystick Additional Info"],
    ["201", "CIA2", "CIA cycle; ports, timers, and connected signals"],
    ["203", "PLA", "LORAM, HIRAM, CHAREN, GAME, and EXROM when configuration changes"],
    ["104", "VIC-II", "Raster, graphics state, badlines, sprites, BA/AEC, and stop prediction"],
    ["105", "SID", "Three-voice state, ADSR, and waveforms"],
    ["Memory", "C64 map", "Configuration changes and Applied Set writes"],
    ["I/O", "Datasette/IEC/peripherals", "Tape traps and serial-bus state when selected"]
  ],
  "records": [
    {"name":"VICII — Info Cycle","producer":"src/COMMODORE/VICII/VICII.cpp :: debugVICIICycle","fields":"Raster position; Internal(IDLE, VCBASE, VC, VLMI, GAccessIndex, RC, ROW, last data, and complete badline state); CPU bus ownership(BA, AEC, windows, and DMA masks); CPU stop prediction; Border; Graphics mode; Memory location.","timing":"Snapshot taken before the main processing of the recovered VIC-II cycle. The header uses cpu.clockCycles()-i.","events":"In shared graphics cycles the g-access event precedes the c-access event; an optional CPU-phase register-write record follows all VIC-II bus activity. Sprite composition and pixel drawing occur later in the same absolute cycle."},
    {"name":"VICII — Video Matrix / graphics pipeline / pixel composition","producer":"src/COMMODORE/VICII/VICII.cpp :: debugReadingVideoMatrix, debugReadingGraphics and debugDrawPixelAt","fields":"Reading Video Matrix & Color RAM: Screen, Color, VLMI, VC, and Invalid. Reading Graphics: Data, GAccessIndex, VLMI, VC, RC, and Idle. Drawing pixels: Raster, XScroll, GraphicPixel, FirstByte, and LastByte; FirstByte/LastByte are OUT when the complete slice lies beyond the 320-pixel graphics buffer.","timing":"c-access runs in phi2 of cycles 15..54 and prepares the matrix/color entry for the following g-access. g-access runs in phi1 of cycles 16..55, is logged before VC/VLMI/GAccessIndex advance, and therefore precedes c-access when both occur in one recovered CPU cycle. Drawing pixels is appended during final slice composition after the current CPU-phase VIC-II register write has become visible.","events":"Cycle 15 contains only the first c-access; cycles 16..54 log g-access and then c-access; cycle 55 contains only the final g-access. Invalid=1 identifies a DMA-delay/FLI c-access that supplied fallback bus data. The pixel record maps the eight-pixel raster slice to the inclusive source-byte interval selected after XSCROLL and clipping to graphics pixels 0..319."},
    {"name":"VICII — CPU transaction prediction","producer":"src/COMMODORE/VICII/VICII.cpp :: debugCPUStopPrediction","fields":"Transaction and bus structure; raster origin; current and following BA/AEC windows; DMA masks; stop prediction and write-effect positions.","timing":"Emitted when instruction or interrupt context is received, before its cycles are recovered.","events":"CPU stop recalculation reports Reason=BadLineChange or SpriteDMAChange and serialises the windows/prediction again."},
    {"name":"VICII — CPU stop applied / VIC-II register write","producer":"src/COMMODORE/VICII/VICII.cpp","fields":"Applied cycle, raster position, duration, and first stop cycle; or address/register/value, write index, and pending writes.","timing":"The register-write event is emitted during the CPU phase of the reported absolute cycle, after the VIC-II phi1 access and any stolen phi2 c-access, and before final pixel/IRQ processing.","events":"Its position after all memory-access events in the same Info Cycle makes the effective phase order explicit."},
    {"name":"CIA1/CIA2 — Info Cycle","producer":"src/COMMODORE/CIA/CIA.cpp :: debugCIACycle","fields":"Each port: output latch, DDR, and effective hexadecimal value. Each timer: ON/OFF, count mode, initial latch, and current counter.","timing":"cpu.clockCycles()-i for each recovered cycle.","events":"CIA1 adds Additional Info with the keyboard matrix, last pressed/released key, and joystick registers."},
    {"name":"SID — Info Cycle","producer":"src/COMMODORE/SID/SID.cpp :: debugSIDCycle","fields":"Voice N: ACTIVE, ADSR, and three Wave n=TYPEANDFREQUENCY descriptions.","timing":"cpu.clockCycles()-i. Describes the current sound wrapper, both simple and reSID.","events":"Adds no subordinate events."},
    {"name":"PLA / C64 Memory","producer":"src/C64/PLA.cpp and src/C64/Memory.cpp","fields":"PLA: five on/off logic lines. C64 Memory: per subset (active, active for reading).","timing":"PLA uses the current CPU cycle; Change Configuration uses cycle -.","events":"The state reflects the implemented configuration after changes to the 6510 port or cartridge lines."}
  ],
  "example": [
