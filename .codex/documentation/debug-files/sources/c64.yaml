    "+"
  ],
  "example_note": "Reduced extract from emulators/N.LOG. Ellipses replace fields to keep the example focused; the preceding catalog defines the current output.",
  "limitations": [
    "A block may contain register values already modified by a complete instruction even when the recovered VIC-II cycle is earlier within that instruction.",
    "Windows are serialised as FirstBA/FirstAEC/LastCycle/BadLineSource/SpriteSourceMask, with multiple windows separated by |.",
    "For bad lines, BadlineCAccessStartCycle is the latch cycle, BadlineFirstCAccessCycle is the first attempted access, BadlineCAccessStartedFromIdle preserves the sequencer state at recognition, and BadlineBARequestCycle is the first effective BA cycle.",
    "CIA1 Additional Info does not represent an additional cycle.",
    "Sprite and pixel events can make the file grow substantially when VIC-II is selected."
  ],
