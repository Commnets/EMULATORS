  "records": [
    {"name":"VICII — Info Cycle","producer":"src/COMMODORE/VICII/VICII.cpp :: debugVICIICycle","fields":"Raster position; Internal(IDLE, VCBASE, VC, VLMI, GAccessIndex, RC, ROW, last data, BadlineCAccessStartedFromIdle, and complete badline state); CPU bus ownership(BA, AEC, windows, DMA masks, BadLineSource, and SpriteSourceMask); CPU stop prediction; Sprite DMA state(EnabledMask, ActiveMask, DisplayMask, YExpansionMask, YExpansionFlipFlopMask, and eight-entry Y, MCBASE, and MC lists); Border(Main, Vertical, and LastEventAt); Graphics mode; Memory location. List entries use sprite order 0..7 and | as separator. LastEventAt is the visible position of the latest horizontal-comparator transition of either border flip-flop.","timing":"Snapshot taken before the main processing of the recovered VIC-II cycle. The header uses cpu.clockCycles()-i. Horizontal border comparators evaluate physical raster pixels 0..3 before the CPU-phase register write and pixels 4..7 after it; the final-cycle vertical comparison observes the post-write state. Comparator results are translated to the aligned ScreenMemory slice, so a transition beyond its last pixel becomes visible in the following slice.","events":"In shared graphics cycles the g-access event precedes the c-access event; an optional CPU-phase register-write record follows all VIC-II bus activity. BadlineCAccessStartedFromIdle records the sequencer state latched at the start of the recognition cycle: late sequences from idle defer their first c-access by one cycle, while late sequences from active display can attempt it in the recognition cycle. Sprite DMA [Sprite,Active,Y,MCBASE,MC,YExpansion,YExpansionFlipFlop] marks the exact cycle where a sprite DMA channel starts or stops. Horizontal border transitions are retained per aligned output pixel for later composition while the hardware flip-flops advance at the physical comparator. The vertical-border rules are evaluated at the exact left comparator and again at the final raster cycle. Sprite composition and pixel drawing occur later in the same absolute cycle."},
    {"name":"VICII — Video Matrix / graphics pipeline / pixel composition","producer":"src/COMMODORE/VICII/VICII.cpp :: debugReadingVideoMatrix, debugReadingGraphics, debugDrawPixelAt and debugDrawSpriteAt","fields":"Reading Video Matrix & Color RAM: Screen, Color, VLMI, VC, and Invalid. Reading Graphics: Data, GAccessIndex, VLMI, VC, RC, and Idle. Drawing pixels: Raster, FirstPixel, LastPixel, XScroll, GraphicPixel, FirstByte, and LastByte. FirstPixel/LastPixel are inclusive positions inside the current eight-pixel slice; GraphicPixel is the first source pixel of that span; FirstByte/LastByte are OUT when the complete span lies beyond graphics pixels 0..319. Drawing sprite: sprite number and latched X,Y position.","timing":"c-access runs in phi2 of cycles 15..54 and prepares the matrix/color entry for the following g-access. g-access runs in phi1 of cycles 16..55, is logged before VC/VLMI/GAccessIndex advance, and therefore precedes c-access when both occur in one recovered CPU cycle. Drawing pixels is appended during final composition. A steady slice emits one span 0..7; a visual CPU register write emits span 0..3 with the state captured before the write and span 4..7 with the state captured after it. Drawing sprite is emitted when the horizontal comparator latches: pixels 0..3 are compared before the CPU write and pixels 4..7 after it.","events":"Cycle 15 contains only the first c-access; cycles 16..54 log g-access and then c-access; cycle 55 contains only the final g-access. Invalid=1 identifies a DMA-delay/FLI c-access that supplied fallback bus data. Each pixel record maps its output span to the inclusive source-byte interval selected using that span's XSCROLL and clipping to graphics pixels 0..319. Once a sprite X position is latched, a later write cannot reposition its running sequencer."},
    {"name":"VICII — CPU transaction prediction","producer":"src/COMMODORE/VICII/VICII.cpp :: debugCPUStopPrediction","fields":"Transaction and bus structure; raster origin; current and following BA/AEC windows with badline/sprite provenance; DMA masks; stop prediction and write-effect positions.","timing":"Emitted when instruction or interrupt context is received, before its cycles are recovered.","events":"CPU stop recalculation reports Reason=BadLineChange or SpriteDMAChange and serialises the windows/prediction again."},
    {"name":"VICII — CPU stop applied / VIC-II register write","producer":"src/COMMODORE/VICII/VICII.cpp","fields":"Applied cycle, raster position, duration, and first stop cycle; or address/register/value, write index, and pending writes.","timing":"The register-write event is emitted during the CPU phase of the reported absolute cycle, after the VIC-II phi1 access and any stolen phi2 c-access, and before final pixel/IRQ processing.","events":"Its position after all memory-access events in the same Info Cycle makes the effective phase order explicit."},
    {"name":"CIA1/CIA2 — Info Cycle","producer":"src/COMMODORE/CIA/CIA.cpp :: debugCIACycle","fields":"Each port: output latch, DDR, and effective hexadecimal value. Each timer: ON/OFF, count mode, initial latch, and current counter.","timing":"cpu.clockCycles()-i for each recovered cycle.","events":"CIA1 adds Additional Info with the keyboard matrix, last pressed/released key, and joystick registers."},
    {"name":"SID — Info Cycle","producer":"src/COMMODORE/SID/SID.cpp :: debugSIDCycle","fields":"Voice N: ACTIVE, ADSR, and three Wave n=TYPEANDFREQUENCY descriptions.","timing":"cpu.clockCycles()-i. Describes the current sound wrapper, both simple and reSID.","events":"Adds no subordinate events."},
    {"name":"PLA / C64 Memory","producer":"src/C64/PLA.cpp and src/C64/Memory.cpp","fields":"PLA: five on/off logic lines. C64 Memory: per subset (active, active for reading).","timing":"PLA uses the current CPU cycle; Change Configuration uses cycle -.","events":"The state reflects the implemented configuration after changes to the 6510 port or cartridge lines."}
  ],
